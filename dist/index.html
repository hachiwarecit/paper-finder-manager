<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>応用情報 用語ドリル</title>
<style>
:root{
  --bg:#0e1014; --surface:#171a21; --surface2:#1f232c; --line:#2a2f3a;
  --fg:#e7e9ee; --muted:#98a1b2;
  --ok:#2f9e63; --ok-dim:#16341f; --ng:#c9483f; --ng-dim:#3a1a19;
  --accent:#5b8def;
  --tap:56px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:16px;line-height:1.5;
  overscroll-behavior:none;
}
#app{
  height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) var(--sab) var(--sal);
}
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---- 進捗バー: 数字より残量 ---- */
#bar{height:3px;background:var(--surface2);flex:none}
#bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}

/* ---- 開始画面 ---- */
#start{padding:16px;overflow-y:auto}
h1{font-size:19px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.big{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);color:var(--fg);font-size:16px;font-weight:600;
  margin-bottom:10px;cursor:pointer;
}
.big.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.big:disabled{opacity:.4}
.rowlabel{font-size:12px;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}
.rowlabel button{background:none;border:none;color:var(--accent);font-size:12px;padding:4px;cursor:pointer}
#cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer;
  min-height:38px;display:flex;align-items:center;
}
.chip[aria-pressed="true"]{background:#1d2b4a;border-color:var(--accent);color:#dbe6ff}

.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:var(--tap);border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg);padding:10px 12px;margin-bottom:8px;
  text-align:left;cursor:pointer;font-size:14px;
}
.toggle b{display:block;font-weight:600}
.toggle i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}
.toggle .sw{flex:none;width:40px;height:24px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle[aria-pressed="true"] .sw{background:#23407a;border-color:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--accent)}

/* ---- 出題画面: 上半分に問題, 下半分に選択肢 ---- */
#quiz{padding:0}
#qtop{
  flex:1 1 45%;min-height:0;display:flex;flex-direction:column;
  justify-content:center;padding:14px 16px;overflow-y:auto;
}
#kind{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
#stem{font-size:15px;color:var(--muted);margin-bottom:6px}
#focus{font-size:26px;font-weight:700;line-height:1.3;word-break:break-word}
#focus small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}

#opts{
  flex:0 0 auto;display:flex;flex-direction:column;gap:8px;
  padding:8px 12px calc(12px + var(--sab));
}
.opt{
  display:flex;align-items:center;gap:10px;
  min-height:var(--tap);width:100%;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);
  color:var(--fg);font-size:15.5px;text-align:left;padding:10px 12px;
  cursor:pointer;
}
.opt .n{
  flex:none;width:22px;height:22px;border-radius:6px;background:var(--surface2);
  color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;
}
.opt .t{flex:1;min-width:0;word-break:break-word}
.opt[data-s="ok"]{background:var(--ok-dim);border-color:var(--ok)}
.opt[data-s="ng"]{background:var(--ng-dim);border-color:var(--ng)}
.opt[data-s="ok"] .n{background:var(--ok);color:#fff}
.opt[data-s="ng"] .n{background:var(--ng);color:#fff}
.opt[data-s="dim"]{opacity:.45}

/* ---- 解答後の比較 ----
   解答すると問題文を 1 行に畳み、空いた領域を比較カードに渡す。
   正解と、選んでしまった誤答を必ず同時に見せるため。 */
#quiz.answered #qtop{flex:0 0 auto;padding:10px 16px 4px;overflow:visible}
#quiz.answered #stem{display:none}
#quiz.answered #focus{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#quiz.answered #focus small{display:none}
/* 選ばれなかった選択肢は畳んで、比較カードに高さを譲る。
   正解と自分が選んだものは 56px のまま残す。 */
#quiz.answered .opt[data-s="dim"]{min-height:0;height:34px;font-size:13px;padding:4px 12px}
#detail{display:none;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px 10px}
#detail.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:3px;
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.ok{border-left-color:var(--ok)}
.card.ng{border-left-color:var(--ng)}
.card .h{font-size:11px;letter-spacing:.06em;margin-bottom:4px}
.card.ok .h{color:var(--ok)}
.card.ng .h{color:var(--ng)}
.card .term{font-size:16px;font-weight:600;margin-bottom:3px}
.card .path{font-size:12px;color:var(--muted)}
/* 項目の内容文 (IPA 原文) は補足なので 5 行で抑える。
   比較の主役は上の分類パスで、これが長いと 2 枚目のカードが画面外に落ちる。 */
.card .body{font-size:12.5px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--line);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
#hint{text-align:center;font-size:11.5px;color:var(--muted);padding:6px 0 calc(8px + var(--sab))}

/* ---- 想起フェーズ: 選択肢を伏せて、先に自力で思い出させる ---- */
#optwrap{position:relative;flex:0 0 auto}
#cover{
  position:absolute;inset:0;z-index:2;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;
  background:var(--bg);border-radius:12px;cursor:pointer;
}
#cover.on{display:flex}
#cover b{font-size:15px;font-weight:600}
#cover i{font-style:normal;font-size:12px;color:var(--muted)}
#quiz.masked #opts{visibility:hidden}

/* ---- 終了画面 ---- */
#end{padding:16px;overflow-y:auto}
#end h2{font-size:17px;margin:2px 0 12px}
.miss{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;margin-bottom:8px}
.miss .term{font-weight:600;font-size:15px}
.miss .path{font-size:12px;color:var(--muted);margin-top:2px}
.allok{color:var(--ok);font-size:14px;margin-bottom:14px}

@media (min-width:560px){ #focus{font-size:30px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div id="app">
  <div id="bar"><i></i></div>

  <!-- 開始画面 -->
  <section id="start" class="screen on">
    <h1>応用情報 用語ドリル</h1>
    <p class="sub">IPA シラバス Ver.7.2 ／ <span id="nterms"></span> 語</p>
    <div class="note" id="disclaimer"></div>

    <button class="big primary" id="go">はじめる（10問）</button>
    <button class="big" id="goreview">復習のみ <span id="rcount"></span></button>

    <div class="rowlabel"><span>出題の設定</span></div>
    <button class="toggle" id="tRecall" aria-pressed="true">
      <span><b>思い出してから選択肢を開く</b><i>選択肢を先に見ると「見覚え」で当ててしまう</i></span>
      <span class="sw"></span>
    </button>
    <button class="toggle" id="tCat" aria-pressed="false">
      <span><b>分類だけの問題も混ぜる</b><i>意味を問う問題は <span id="nmean"></span> 問。足りなければ有効に</i></span>
      <span class="sw"></span>
    </button>

    <div class="rowlabel">
      <span>出題範囲</span>
      <span><button id="all">全選択</button><button id="none">全解除</button></span>
    </div>
    <div id="cats"></div>
  </section>

  <!-- 出題画面 -->
  <section id="quiz" class="screen">
    <div id="qtop">
      <div id="kind"></div>
      <div id="stem"></div>
      <div id="focus"></div>
    </div>
    <div id="detail"></div>
    <div id="optwrap">
      <div id="opts"></div>
      <div id="cover"><b>思い出せた？</b><i>タップで選択肢を開く</i></div>
    </div>
    <div id="hint"></div>
  </section>

  <!-- 終了画面 -->
  <section id="end" class="screen">
    <h2>今回のセッション</h2>
    <div id="misslist"></div>
    <button class="big primary" id="again">つづける（10問）</button>
    <button class="big" id="back">範囲を選びなおす</button>
  </section>
</div>

理解する。","アナログとデジタルの特徴，量子化，標本化，A/D 変換などの符号化，符号化の目的，情報伝送における信頼性，効率性，安全性の向上などの効果を理解する。","代表的な文字コードを理解する。","述語論理の考え方，演繹推論と帰納推論の違いを理解する。","形式言語とは何か，言語の定義，演算，種類，文法を理解する。また，BNF，構文図式などの表記法，正規表現，文脈自由文法を理解する。","有限オートマトンの概念，形式言語との関係，チューリング機械との関係，状態遷移表，状態遷移図を理解する。","プログラムの正当性理論とは何か，部分正当性，全正当性の基本的な考え方，仕組みを理解する。","計算量の理論の考え方を理解する。","AI の基本的な考え方を理解する。 機械学習の基本的な仕組み，代表的な手法，及び機械学習のモデルの精度を高めるための代表的な手法，並びにモデルの精度を評価するための代表的な手法を理解する。 ディープラーニングの基本的な仕組み，ディープラーニングの精度を高めるための代表的な手法を理解する。 ディープラーニングの手法を，自然言語処理，音声・画像処理などの分野に応用するための考え方，仕組みを理解する。","コンパイラの役割，コンパイルの過程，字句解析，構文解析，意味解析，コード生成，最適化の基本的な考え方，仕組みを理解する。","","デジタルデータを，アナログ伝送路を介して送るために必要な処理である変調，それを受信側で元に戻す処理である復調の代表的な方式の考え方，仕組みを理解する。 一つの伝送路を複数の通信で同時に使用する多重化について，代表的な方式の考え方，仕組みを理解する。 送信側と受信側で送受信のタイミングを合わせる信号同期制御について，代表的な方式の考え方，仕組みを理解する。 暗号化に関連する技術の考え方，仕組みを理解する。","アナログ波形を分析して，雑音を除去し，特徴を抽出する信号処理の考え方，仕組みを理解する。","制御の考え方，仕組みを理解する。また，フィードバック制御，フィードフォワード制御など，各種制御の考え方，仕組みを理解する。 コンピュータ制御では，制御対象の光，温度，圧力などの状態をセンサーで検出し，コンピュータが判断して，アクチュエーターを通じて電動，油圧，水圧，空気圧などの機械的な動作に変換し，制御対象を一定の状態に保つなどの制御を行うことを理解する。 測位システムなど，コンピュータを利用した高度な計測システムの考え方，仕組みを理解する。","リストの考え方，その操作を理解する。 木構造の種類と考え方，木の巡回法，節の追加や削除，ヒープの再構成などを理解する。","アルゴリズムや流れ図（フローチャート）の考え方，記号，順次，判定，繰返しなど，処理手順の表現方法を理解し，流れ図を描く方法を理解する。","整列のアルゴリズム，併合のアルゴリズム，探索のアルゴリズムを理解する。 再帰的アルゴリズムの考え方，特徴，実現に適したデータ構造を理解する。 グラフのアルゴリズムを理解する。 文字列処理のアルゴリズムを理解する。 バッチ処理などで用いる整列処理，併合処理，コントロールブレーク処理，編集処理のアルゴリズムを理解する。 モンテカルロ法を例として確率アルゴリズムを理解する。 最適化問題への進化論の適用例であることを理解する。 情報検索，機械翻訳などを例に，自然言語処理のアルゴリズムを理解する。 3 次元図形処理アルゴリズムを理解する。 OS のメモリ管理の方法について，空きメモリ管理のためのデータ構造，メモリの割当て，開放などのアルゴリズムを理解する。","アルゴリズムは，擬似言語，流れ図，決定表（デシジョンテーブル）などを用いて表現することを理解する。また，アルゴリズムの設計方法を理解する。","プログラミング作法とコーディング標準の目的，効果，種類を理解する。また，プログラミング作法とコーディング標準を守らない場合に起こる弊害を理解する。 プログラムの信頼性，保守性の観点からプログラム構造を理解する。 プログラム言語で使用される代表的なデータ型を理解する。 Web サーバと Web クライアントの仕組みを理解し，Web サーバ，Web クライアントにおけるプログラムの役割と作成方法，Web アプリケーションプログラムを開発する環境を理解する。","","プログラム言語は，機械語，アセンブラ言語，高水準言語と発展してきたこと，プログラム言語の分類を理解する。 共通言語基盤（CLI：Common Language Infrastructure）JIS X 3016（ISO/IEC 23271）で標準化されている共通言語基盤（CLI）の特徴，利用法を理解する。","プログラム言語の基本的な制御構造，手続と関数，逐次制御と並列制御を理解する。","プログラムの実行に必要な記憶域の考え方，利用法を理解する。","","Web ページの作成に利用される HTML の特徴，基本的な記述方法を理解する。 HTML の機能に加えて，独自にタグを定義することができる機能を備え，主にインターネットを介したデータ交換に利用されている XML の特徴，基本的な記述方法を理解する。 HTML を XML で再定義したマークアップ言語である XHTML の特徴，基本的な記述方法を理解する。 HTML や XML などマークアップ言語の構造と表示形式を分離するための仕様であるスタイルシートを理解する。","オブジェクト指向設計のための表記法である UML やその他の言語を理解する。","パーソナルコンピュータ（PC），ワークステーション，スーパーコンピュータなどの特徴，用途を理解する。","コンピュータが五つの装置から構成されること，装置間の制御の流れ，データの流れを理解する。","","プロセッサのアーキテクチャによって，プロセッサが 1 命令で処理するデータサイズに違いがあることを理解する。 1 命令で処理するオペランドの数で命令の形式を分類できることを理解する。 プロセッサのアーキテクチャによって命令セットに違いがあること，プロセッサアーキテクチャとしては RISC と CISC があることを理解する。","プロセッサを構成する制御装置と演算装置の役割，それらを構成する加算器，レジスタ，デコーダ（命令解読器，復号器）などの役割，プロセッサの能力とシステムの処理能力の関係を理解する。また，命令実行時のレジスタの動作を理解する。","AND 回路，OR 回路，NOT 回路などの基本となる論理回路の組合せによって半加算器，全加算器が実現され，演算が行われていることを理解する。 代表的な機械語命令の種類，命令語の構成，命令の実行手順（命令の取出し，命令部の解読，データの取出し，命令の実行），アドレス修飾を理解する。また，機械語演算のバイナリ表現，アセンブラの記号表現との対応，相互の変換を行う方法を理解する。 割込みの仕組み，内部割込み，外部割込みに分類される割込みの種類，多重割込み時の処理を理解する。","プロセッサの動作を制御する仕組みとして，1  機械語命令を実行するためのプログラム（マイクロプログラム）をファームウェア化して内蔵する方式があること，その特徴を理解する。","","プロセッサの代表的な高速化技術の種類，特徴を理解する。","並列化できないため逐次処理にならざるを得ない処理として，複数のプロセッサからの主記憶装置の使用要求の競合，データベースへの同時アクセスによるロックの発生などがあること，それらの処理が能力向上を阻害する原因となることを理解する。","複数のプロセッサを搭載し，高速化及び高信頼化を実現したシステムについて，種類，特徴，仕組み，マルチプロセッサシステムを適切に組み合わせた基盤設計を理解する。","半導体の記憶回路，磁気記憶，光記憶を用いたメモリなどの種類があること，半導体メモリ（IC メモリ）の種類，特徴（揮発性，不揮発性，アクセス速度，容量，コスト，物理サイズなど），代表的な用途，システム設計におけるメモリの選択の考え方を理解する。","主記憶装置の構成，主記憶装置内のデータがアクセスされるアドレス選択動作，アクセス動作などの手順を理解する。","記憶階層の構成，キャッシュメモリからデータを主記憶に書き出す方式の種類と特徴を理解する。また，キャッシュメモリからデータを主記憶に書き出す方式を理解する。","取り外しできる記録媒体（リムーバブルメディア）の種類，記録容量，可搬性，利用法，用途などの特徴を理解する。","コンピュータ内部でデータをやり取りするための伝送路であるバスの種類，特徴，内部バス（CPU 内部バス），外部バス，拡張バスなどの分類，転送方式を理解する。","複数の装置がバスを共有している場合に，どの装置がバスを使用するかを決めるバスの制御方式や，具体的な動作を理解する。","バスの標準規格の種類と特徴を理解する。","入出力インタフェースの種類，転送方式，伝送速度，接続可能台数，用途などの特徴を理解する。 シリアルデータ転送方式とパラレルデータ転送方式や，周辺装置を接続する際の接続形態（トポロジ）の種類，特徴，使用される機器を理解する。 CPU を介さない転送方式である DMA 方式やチャネル制御方式を理解する。また，入出力割込みが果たす役割を理解する。","代表的な入力装置の種類，特徴，仕組み，用途を理解する。","代表的な表示装置や出力装置の種類，特徴，仕組み，用途を理解する。また，画像のデータ容量などに関連する計算方法を理解する。","代表的な補助記憶装置や記憶媒体の種類，特徴，仕組み，用途，装置の諸元に基づく記憶容量や，平均アクセス時間の計算方法を理解する。","","分散処理システムの仕組み，特徴を理解する。 バッチ処理，リアルタイム処理などシステムの利用形態の種類と特徴，どのような業務にどの形態が適しているかを理解する。","代表的なシステム構成の種類，特徴を理解する。また，システム構成要素間の機能配分，冗長構成によるシステムの信頼性向上，負荷分散によるレスポンス速度の向上などを理解する。","高精度な高速演算を必要とするような分野で利用される HPC （ High Performance Computing：ハイパフォーマンスコンピューティング）の特徴や，HPC を可能にするためのスーパーコンピュータや複数のコンピュータを LAN などで結んで，CPU などの資源を共有して単一の高性能なコンピュータとして利用できるようにした構成を理解する。","クライアントサーバシステムの特徴，2 層クライアントサーバシステム，3 層クライアント サーバシステムの構成を理解する。また，データベースに対するストアドプロシージャなど，関連技術の特徴を理解する。","","複数の記憶装置をまとめて一つの装置として扱い，信頼性や速度を向上させる技術である RAID の種類と特徴，NAS，SAN などストレージ関連技術の特徴を理解する。","システム障害の影響を最小限に抑えるフォールトトレラントやヒューマンエラー回避技術など，信頼性設計に関する考え方，どのようなシステム構成，技術があるかを理解する。","システムの性能を評価する際の評価項目の種類や特徴，その指標を理解する。 キャパシティプランニングの目的，考え方，システムに求められる処理の種類，量，処理時間などを検討し，性能要件からサーバやストレージなどの性能諸元を見積り，システムの性能を継続的に把握，評価するという手順を理解する。","システムを評価する際の評価項目となる Reliability（信頼性），Availability（可用性），Serviceability（保守性），Integrity（完全性），Security（安全性）とその指標を理解する。 MTBF，MTTR，稼働率などシステムの信頼性を評価する際の評価項目とその指標，並列システム，直列システムの稼働率の計算方法を理解する。","ソフトウェアの体系におけるOS の位置付けと必要性，汎用機用，パソコン用，リアルタイム用などの OS の種類，特徴，近年の動向を理解する。","OS の機能，構成，カーネル，言語プロセッサなどを理解する。","一つのまとまった仕事の単位であるジョブと，それを構成するジョブステップの概念，ジョブ管理の手順，ジョブ管理に関連する制御プログラムの役割を理解する。","タスクとジョブステップ，スレッドとの関係，タスクの生成から実行，消滅までの状態遷移，ディスパッチャの役割を理解する。 多重（マルチ）プログラミングの考え方，タスクのスケジューリングの代表的な方式に ついて，スケジューリングの方法，特徴，スケジューリングにおけるトリガーと優先順位 の役割，同期制御・排他制御の必要性，実現方法を理解する。また，タスクとタスクの同 期，タスク間でのデータの受け渡し，マルチスレッドの考え方，並列処理などを理解する。","補助記憶装置へのアクセスを装置に依存しないインタフェースでアプリケーションプログラムに提供する機能を理解する。","入出力装置を効率良く動作させる入出力制御方式の種類，特徴，チャネルの種類，データ転送方式など，入出力制御の仕組みを理解する。また，スプール，バッファリングなど CPUのアイドル時間を減らして効率を上げるための仕組みを理解する。","記憶領域の管理方式である固定区画方式，可変区画方式など，実アドレス空間の割当て方式の特徴，フラグメンテーションとその対策を理解する。また，主記憶装置を効率良く使うためのスワッピングとオーバーレイを理解する。 実記憶と仮想記憶の関係，仮想記憶の有効性，仮想記憶方式の種類と特徴，動的アドレス変換の仕組みを理解する。また，ページング方式の代表的なページ置換えアルゴリズムについて，ページ置換え手順を理解する。","ネットワーク制御プログラムの役割，機能，OS における位置付けを理解し，OS が提供する通信インタフェースを理解する。","システム始動処理（OS の初期化），システム終了処理，オペレーターとの交信，ユーザー管理機能，スケジューリング，システムモニタリングなど，運用に関する容易性や柔軟性を実現する機能を理解する。","ユーザーアカウントの種類，特徴を理解し，アカウントの作成方法，パスワードの設定や変更方法，権限の付与や変更方法などを理解する。また，アカウントを一元管理するためのディレクトリサービスなどを理解する。","OS には，アクセス制御，フロー制御，推論制御，暗号化制御などのセキュリティ制御機能があることを理解し，OS での制御方法の種類と特徴を理解する。また，ファイル保護，外部からの侵入検出と防御などのセキュリティが施されたセキュリティカーネルの特徴を理解する。","障害の検出，試験と診断，自動訂正，障害の記録，再構成，リスタート，原因の解決など，障害発生から対策完了までの一連の工程を理解する。","プログラムには，ソースプログラム，オブジェクトプログラムなどの形態があること，ソ ースプログラムの管理対象には，データ構造定義，レコード構造定義などのマクロソースが あることを理解する。また，再入可能プログラム，逐次再使用可能プログラムなどの性質と，それらの使用のされ方を理解する。","サービスプログラムの種類と特徴を理解する。","OS とアプリケーションソフトウェアの中間に位置する各種ミドルウェアの役割と機能，ミドルウェアの選択と利用の考え方を理解する。","シェルは，利用者からのコマンド，指示を受けてそれを解釈し，プログラムの起動，制御などカーネルの機能を呼び出す役割をもつこと，及び代表的なコマンドを理解する。","","プログラムやマクロなどを格納するライブラリを理解する。","オブジェクト指向技術を基盤としたソフトウェアの部品化によるソフトウェア開発手法であるコンポーネントウェアの考え方，代表的なコンポーネントウェア技術を理解する。","アプリケーションソフトウェアの標準構造の実装に使われるクラスやライブラリの集まりである開発フレームワークの考え方，代表的なフレームワークを理解する。","ファイルを階層化して扱うディレクトリの種類と特徴，ディレクトリが管理するファイル情報，ファイル制御ブロック，ファイルポインタ，ファイルハンドルなどのファイル管理の仕組み，絶対パス，相対パスを使用したファイルの特定方法を理解する。また，ディレクトリ管理，ファイル共有の仕組み，考え方，アクセス権を理解する。","ハードディスク装置などの補助記憶装置の領域を，OS や利用者がファイルやディレクトリ（フォルダ）として使用できるようにするための機能を理解する。また，OS ごとに異なるファイルシステムが提供されていること，代表的なファイルシステムの特徴を理解する。","ファイル編成やアクセス手法の種類，特徴を理解する。また，各編成方式におけるレコードの追加，削除，変更などの処理方法を理解する。","","ファイルのリカバリを目的としたバックアップの取得方法と手順，世代管理，ファイルの修復方法と手順など，バックアップの方式を理解する。","設計を支援するツール，プログラミングやテストを支援するツール，ソフトウェア開発の各工程を通して自動化，効率化を目的とするツール，開発作業全体を一貫して工程を支援する IDE（Integrated Development Environment：統合開発環境）など，代表的な開発ツールの種類，特徴，機能を理解する。","代表的な言語処理ツールの種類，特徴，機能を理解する。","LAMP/LAPP（LAMP：Linux，Apache，MySQL，PHP，LAPP：Linux，Apache，PostgreSQL，PHP）を中心に広く利用されている OSS（Open Source Software：オープンソースソフトウェア） の代表的な種類，特徴，機能，再配布の自由，派生ソフトウェア改変の許諾などオープンソ ースライセンシングの内容，OSS の近年の開発や普及の動向を理解する。","代表的な OSS である UNIX 系 OS を理解する。","機械学習・ディープラーニングで用いられる代表的な OSS のフレームワークとその特徴を理解する。 システム開発・運用の支援などに用いられる代表的な OSS とその特徴を理解する。","オープンソースコミュニティによるソフトウェア開発の仕組みを理解する。","ライセンスの適用範囲，利用時のサポートにかかるコスト，問題発生時の対処など，OSSを利用する上で考慮すべき点を理解する。","コンピュータの基本的な論理回路である AND 回路，OR 回路，NOT 回路などの動作原理，論理回路は，組合せ論理回路と順序論理回路に分類できること，回路ごとの特徴を理解する。","代表的な機械電子制御の実現方法について，その構造や動作原理，各部の働きを理解する。","代表的な半導体素子の動作原理，構造，特性，実装を理解する。 利用者が要求する回路をIC として実現できることを理解する。 組込み分野などで利用され，複数の半導体を組み合わせることによって占有面積を縮小し，システムを小型化し，高速化，低コスト化などのメリットがあることを理解する。 組込みシステムを構成する部品の役割，部品間の関係を理解する。","性能，設計効率，コストなどを考慮して，どの構成が最適であるのかを検討し，設計することを理解する。","ハードウェアの消費電力について，組込み機器の開発における消費電力の重要性，関連する技術，動向を理解する。","情報アーキテクチャ（インフォメーションアーキテクチャ）の考え方，目的，情報の組織化（五十音，カテゴリなど），構造化（階層型，タグ付けなど）などを理解する。","ユーザビリティ，アクセシビリティ，インタラクティブシステム，インタラクションの原則，ヒューマンインタフェース，音声認識，画像認識，動画認識，特徴抽出，学習機能，選択的知覚，ユーザー操作の分析，身体的適合性，シグニファイア，ノンバーバルインタフェース，マルチモーダルインタフェース，空間型インタフェース，自然言語インタフェース，NUI（Natural User Interface），VUI（Voice User Interface），ジェスチャーインタフェース，マルチタッチインタフェース（タップ，スワイプ，フリック，ピンチ，ロングプレスほか），オブジェクト指向 UI（OOUI），タスク指向 UIグラフィックスを用いた視覚的な表示，ポインティングデバイスなどによる直感的な操作などGUI の特徴，GUI で使われる構成部品の特徴と役割，GUI 画面設計やシナリオなどを使用した設計の手順と留意事項を理解する。","利用者にとって理想的な体験をしてもらえるようなシステムやサービスを開発するために必要な UX デザインの考え方や手法を理解する。","情報を可視化し，構造化し，構成要素間の関係を分かりやすく整理するための情報デザインの考え方や手法を理解する。","画面設計の考え方，手順，手法，代表的な入力チェックの方法を理解する。また，入出力項目とデータベースの対応，入出力項目の処理の対応を理解する。 帳票設計の考え方，手順，手法を理解する。また，プリンターの種類やコピー方法など の装置制約事項と帳票設計の関係，フォームオーバーレイや専用の事前印刷用紙への出力，入出力項目とデータベースの対応，入出力項目と処理の対応を理解する。","コードの種類と特徴，利用目的や適用分野に合わせたコード設計の考え方，手順，手法を理解する。","Web デザインにおけるユーザビリティの考え方，ユーザビリティを向上させるための手法，スタイルシートの利用によるデザイン全体の統一や，複数種類の Web ブラウザ対応などを考 慮して Web デザインすることを理解する。また，ユーザビリティに関する国際規格が存在す ること，Web サイトのナビゲーションの手法を理解する。","ユーザビリティの向上を目的とした，人間中心設計の考え方，プロセスを理解する。","ユニバーサルデザインの 7 原則の考え方を理解する。また，情報技術分野においても，イラストによる説明，音声読み上げ，Undo（取消）機能など，ユニバーサルデザインの考え方を応用したインタフェースのあり方，設計手法を理解する。","ユーザビリティ評価の考え方と手法を理解する。","情報のデジタル化，文字，音声，画像などの複数のメディアの統合，インタラクティブ性などマルチメディアの特徴を理解する。また，複数のメディアを編集，統合するオーサリングなど，マルチメディア処理の考え方，必要な資源，機能を理解する。","音声データのデジタル化の原理，音声ファイルの仕組み，代表的な音声ファイル形式の特徴を理解する。","コンピュータにおける画像表現の仕組み，代表的な静止画ファイル形式の特徴を理解する。","フレーム，フレームレートなど，コンピュータにおける動画表現の仕組み，代表的な動画ファイル形式の特徴，動画編集の基本的な手法を理解する。","メディアの種類に応じた圧縮・伸長方法が利用されること，圧縮・伸長の目的，代表的な方式の特徴，仕組み，用途に応じて適切な圧縮方式を選択し，活用することを理解する。","コンピュータでの色の表現（色相，明度，彩度など）に関する特徴を理解する。 ペイント系（ラスター形式）ソフトウェアやドロー系（ベクター形式）ソフトウェアなど，グラフィックスソフトウェアの特徴を理解する。","マルチメディアシステムの特徴，XR（クロスリアリティ），インターネット放送，ノンリニア画像編集システムなどのマルチメディア応用の例を理解する。","代表的なデータベースの種類，データ構造の表現，レコード間の関連付けの方法など種類ごとの特徴，与えられた要件に応じて最適なデータベースを選択し，設計に活用することを理解する。 データベースでは，システムの利用者やプログラムから見たデータの定義（外部スキーマ），論理的なデータ構造（概念スキーマ），物理的なデータ構造（内部スキーマ）の 3 層を区別することでデータの独立性を高めていること，各スキーマの表現方法を理解する。 データベースの論理的なデータ構造を表現するためのデータモデルの種類，特徴，利点，表現できる内容，特徴を理解する。 関係モデルにおいて，データがどのように表されるのか，表の構成，考え方，複数の表の関係付けを理解する。また，与えられた要件に応じて，規定の表記法を使用してデータ構造を表現することを理解する。","DBMS の目的，代表的な機能とともに，DBMS にも階層型，網型，関係型があること，DBMSのマネジメント機能をデータベース開発や保守に利用することを理解する。 複数のトランザクションが一つのデータベースに同時にアクセスするときに必要な制御方法を理解する。 データベースに障害が発生した場合の障害回復機能と回復手順を理解する。 データを共有する際に重要となるセキュリティ確保のための方法を理解する。 代表的なデータベース管理システムの種類と特徴，関係データベース管理システムと NoSQL のデータベース管理システムとの違い，取り扱う上での留意事項，関連する機能を理解する。","対象業務にとって必要なデータは何か，各データがどのような意味と関連をもっているかなどの分析と整理，異音同義語，同音異義語の発生を抑えるデータ項目の標準化など，データ分析を行う際の考え方を理解する。また，データモデルの作成手法であるトップダウンアプローチとボトムアップアプローチを理解する。","開発計画立案，外部設計，内部設計，プログラム作成，テスト，移行に至るまでのデータベース開発の工程と手順，手法を理解する。 概念設計では，要求定義で定義されたデータ項目と，システム機能設計の際に発生したデータ項目をまとめ，データ項目全体を設計することを理解する。また，DBMS に依存しないデータの関連を表現する手法として，E-R 図や UML を使用した構成要素，属性，関連の表し方，特徴，カーディナリティ（1 対 1，1 対多，多対多）などを理解する。 データの重複や矛盾が発生しないテーブル（表）設計の考え方，主キー，外部キーなどの概念，一貫性制約（一意性制約，参照制約，検査制約など）の制約を理解する。また，ビューの機能と定義を理解する。","正規化の目的と手順，第 1 正規形，第 2 正規形，第 3 正規形などを理解する。また，正規化の考え方に従った，具体的な設計案に対して更新容易性や性能面などから評価し，最適な設計を行うことを理解する。","処理の高速化のためにあえて正規化を行わず，表の結合にかかる時間を短縮するなど，パフォーマンスを考慮したデータベース設計の考え方を理解する。","データベースの物理設計では，アクセス効率，記憶効率の側面からデータベースの最適化を図ることを理解する。また，磁気ディスク上に記憶される形式や論理データ構造の物理データ構造へのマッピングなど，データベースの物理的構造を設計する際の留意事項を理解する。","データベース環境の準備，入力データの準備，データベースの定義，データの登録，データベースの検証などの一連のデータベースの作成手順を理解する。","データベースの性能評価方法を理解し，評価結果によってはチューニングや再編成などの対応策が必要であることを理解する。","関係データベースのデータの操作として，集合演算（和，差，積（共通）），関係演算（選択，射影，結合，商，直積）などを理解する。","データベース言語は，DDL（Data Definition Language：データ定義言語）と DML（Data Manipulation Language：データ操作言語）などに大別されること，また，これらには SQLを単独で使用する独立言語方式と，他のプログラム言語から使用する親言語方式があることを理解する。","スキーマ，テーブル，ビュー，処理権限を定義する SQL 文を理解する。また，データ型，列制約，表制約の定義方法，ビューの更新（更新可能なビューと更新不可能なビュー）を理解する。","要求されるデータを選択するために，SELECT 文による問合せの方法，条件を指定した特定行や列の選択，表の結合，BETWEEN や IN などの述語指定，集合関数，グループ化，ウィンドウ，並べ替えなどを理解する。","カーソル操作，非カーソル操作，親言語との接続など，埋込み SQL によるデータ操作の仕組み，利点，利用法を理解する。また，カーソル操作において，カーソルの宣言，操作の開始，終了，読込みを行うなどの SQL 文を理解する。","データの整合性を保つために，複数のトランザクションが同時にデータベースのデータを 更新することが起こらないようにする同時実行制御（排他制御）の考え方を理解する。また，ロック方式，セマフォ方式，コミットメント制御，多版同時実行制御（MVCC）の仕組みを理 解する。","障害に備えたバックアップの方式，世代管理の考え方，障害発生直前の状態まで回復を図るリカバリ処理の仕組み，データベースの利用環境の準備，アクセス効率の向上のための再編成などの考え方，仕組みを理解する。","データベースへのアクセス効率向上のために，インデックスを有効に活用する考え方を理解する。","利用者ごとに，データに対するアクセス制御を行う必要性があること，アクセス権限としてはデータベースに接続する権限，データを検索する権限，データを新規登録する権限，データを更新する権限などがあること，SQL による権限の定義と変更の方法を理解する。","データウェアハウス，データマート，OLAP（Online Analytical Processing），データマイ ニングなど，データを分析して有効活用する技術の特徴，これらの技術が企業会計システム，在庫管理システムなどで使われていること，その応用方法を理解する。","複数のサイトに配置された分散データベースの特徴，利点，取り扱う上での留意事項，サイト間でのデータ同期の仕組み，関連する機能，集中型データベースとの違いを理解する。","データの属性，意味内容，格納場所など，データを管理するための情報（メタデータ）を収集，管理したデータディクショナリや，ソフトウェア開発と保守における様々な情報を一元的に管理するリポジトリを理解する。","通信ネットワークが果たす役割と効果，ネットワーク障害が発生した場合の社会的影響の大きさを理解する。","LAN とWAN の仕組み，特徴，構成要素，運用費用を理解する。また，WAN を構成する場合に利用する電気通信事業者から提供されているサービスの種類と特徴を理解する。","有線 LAN の仕組み，構成要素，特徴を理解する。","無線 LAN の仕組み，構成要素，特徴を理解する。","回線交換とパケット交換の仕組み，特徴を理解する。","回線速度，データ量，転送時間の関係を理解し，与えられた回線速度，データ量，回線利用率からの転送時間の算出方法を理解する。また，発生するトラフィック量から必要な回線速度を算出する方法を理解する。","ノードには，世界で一意となるIP アドレスが割り当てられることによって，相互通信が可能となっていること，アドレスを構成するネットワークアドレスとホストアドレスの役割，IP パケットのルーティングの動作，IPv6 の必要性と特徴を理解する。","代表的なネットワーク構成の種類，特徴，端末，制御機器がどのような形態で接続されるかや，ネットワーク構成図の作成方法を理解する。また，各構成における信頼性と障害時の動作の違いを理解する。 ISO が策定した 7 層からなるネットワークアーキテクチャである OSI 基本参照モデルの各層の機能，各層の間の関係を理解する。","ネットワークで使用される回線の種類，通信方式，交換方式の種類と特徴を理解する。","LAN 内接続，LAN 間接続，LAN-WAN 接続の装置の種類，特徴，各装置の機能が OSI 基本参照モデルのどの層に対応するかを理解する。","送受信者の間でデータを確実に伝送するための制御機能である伝送制御の仕組み，特徴を理解する。","データの送受信方法や誤り検出方法などを規定する MAC（Media Access Control：メディアアクセス制御）の仕組みと特徴を理解する。また，アクセス制御の目的，アクセス制御手法の代表的な種類と仕組みを理解する。","TCP/IP を OSI 基本参照モデルの 7 階層と対比させながら，各層が果たす役割，提供しているインタフェースを理解する。また，代表的なサービスのポート番号（ウェルノウンポート）などを理解する。 ARP など，TCP/IP ネットワークにおいて使用されるデータリンク層レベルのプロトコルの役割，機能を理解する。 アプリケーション層のプロトコル HTTP，SMTP，POP，FTP，DNS などの役割，機能を理解する。 イーサネット，無線 LAN，ISDN，PRI（Primary Rate Interface：1 次群インタフェース）など，LAN と WAN で使用される代表的なインタフェースの役割，機能を理解する。 CORBA はプログラム言語やネットワークプロトコルに依存せず，異機種分散環境におけるシステム統合の基盤の考え方として利用できることを理解する。","障害の検出，分析，対応を行う障害管理の管理方法を理解する。 トラフィック量と転送時間の関係の分析などによる，ネットワークの性能の管理方法を理解する。","ネットワークの運用管理に用いられる代表的なツールやユーティリティの機能，仕組みを理解する。","ネットワークを構成する機器を集中管理するためのプロトコルである SNMP と MIB（Management Information Base：管理情報ベース）を使用したトラフィック解析方法を理解する。","ネットワークの仮想化の仕組み，特徴，構成要素を理解する。","電子メールシステムはメールサーバとメールクライアントで構成されており，送信したメールはメールサーバからメールサーバへリレー方式で配送される仕組みであること，電子メールシステムの特徴，機能を理解する。 WWW はインターネット上で提供されるハイパーテキストのシステムであり，Web サーバと クライアント（Web ブラウザ）を利用してアクセスすること，Web ページはHTML，XML など のマークアップ言語で記述され，ハイパーリンクで簡単に別のページを参照できることや， Web アプリケーションシステムの仕組み，特徴，機能を理解する。 FTP サーバとクライアントの仕組みや Web への組込み方式の仕組み，特徴，機能を理解する。","インターネットの技術を企業内ネットワークの構築に応用したイントラネットの仕組み，特徴，機能を理解する。","","ネットワーク管理や通信サービスの提供を専門に行うソフトウェアであるネットワーク OSの仕組み，特徴，機能を理解する。","代表的な通信サービスの種類，特徴，機能，利用条件，サービス選択上の留意事項を理解する。","モバイル通信サービスの種類，特徴，サービス選択上の留意事項を理解する。 モバイルシステムの構成要素，特徴，機能を理解する。 無線 LAN も含め，無線通信で用いられる基盤技術の特徴を理解する。","情報の機密性（Confidentiality），完全性（Integrity），可用性（Availability）を確保，維持することによって，様々な脅威から情報システム及び情報を保護し，情報システムの信 頼性を高めることを理解する。","社会のネットワーク化に伴い，企業にとって情報セキュリティの水準の高さが企業評価の 向上につながること，情報システム関連の事故が事業の存続を脅かす可能性があることから，情報セキュリティの重要性を理解する。","情報資産に対する様々な脅威を理解する。 マルウェア・不正プログラムの種類とその振る舞いを理解する。","情報システムの情報セキュリティに関する欠陥，行動規範・職務分掌の組織での未整備，従業員への不徹底などの脆弱性を理解する。","不正行為が発生する要因，内部不正による情報セキュリティ事故・事件の発生を防止するための環境整備の考え方を理解する。","悪意をもった攻撃者の種類，及び攻撃者が不正・犯罪・攻撃を行う主な動機，流れを理解する。","情報システム，組織及び個人への不正な行為と手法を理解する。","脅威を防止するために用いられる暗号技術の活用を理解する。また，暗号化の種類，代表的な暗号方式の仕組み，特徴を理解する。 認証の種類，仕組み，特徴，脅威を防止するためにどのような認証技術が用いられるか，認証技術が何を証明するかを理解する。 利用者認証のために利用される技術の種類，仕組み，特徴を理解する。 利用者確認に利用される技術の一つである生体認証技術の種類，仕組み，特徴を理解する。 PKI（Public Key Infrastructure：公開鍵基盤）の仕組み，特徴，活用場面を理解する。","組織の情報セキュリティ対策を包括的かつ継続的に実施するために，情報セキュリティ管理の考え方，情報資産などの保護対象を理解する。","情報セキュリティリスクアセスメント及び情報セキュリティリスク対応に当たり，情報資産（情報システム，データ，文書ほか）を調査して特定することを理解する。 機密性，完全性，可用性の側面から情報資産の重要性を検討し，情報資産を保護するために，定められた基準に基づいて情報資産を分類することを理解する。 調査した情報資産を取り巻く脅威に対するリスクの種類を理解する。 リスクを特定し，そのリスクの生じやすさ及び実際に生じた場合に起こり得る結果を定量的又は定性的に把握してリスクレベルを決定し，組織が定めたリスク受容基準に基づく評価を行うことを理解する。 情報セキュリティリスクアセスメントの結果を考慮して，適切な情報セキュリティリスク対応の選択肢を選定し，その選択肢の実施に必要な管理策を決定することを理解する。","組織が困難な状況（例えば，危機又は災害）に陥る事態に備えて，情報セキュリティ継続（継続した情報セキュリティの運用を確実にするためのプロセス）を組織の事業継続マネジメントシステムに組み込む必要性を理解する。","情報セキュリティ管理における情報セキュリティポリシーの目的，考え方，情報セキュリティポリシーに従った組織運営を理解する。また，組織の情報セキュリティ目的，資産の分類・管理手順，情報セキュリティ対策基準などを体系的に定めることを理解する。","組織体における情報セキュリティ管理の水準を高め， 維持し， 改善していく ISMS（Information Security Management System：情報セキュリティマネジメントシステム）の仕組みを理解する。","インシデント発生時から解決までの一連のフローであるインシデント管理を理解する。","不正アクセスによる被害受付の対応，再発防止のための提言，情報セキュリティに関する啓発活動などを行う情報セキュリティ組織・機関の役割，及び関連する制度を理解する。","情報セキュリティに関する基準，指針を理解する。","情報資産の不正コピーや改ざんなどを防ぐセキュリティ製品の，セキュリティ水準を知るためのセキュリティ技術評価の目的，考え方，適用方法を理解する。","情報技術セキュリティの観点から，情報技術に関連した製品及びシステムが適切に設計され，正しく実装されていることを評価する ISO/IEC 15408（コモンクライテリア）の適用方法を理解する。","人的セキュリティ対策として，人的ミス，不正行為，盗難，ソーシャルエンジニアリングなどのリスクを軽減するための教育と訓練，事件や事故に対して被害を最小限にするための対策を理解する。 技術的セキュリティ対策として，ソフトウェア，データ，PC，サーバ，ネットワークなどに技術的対策を実施することによって，システム開発，運用業務などに被害が発生することを防ぐことを理解する。 物理的セキュリティ対策として，外部からの侵入，盗難，水害，落雷，地震，大気汚染，爆発，火災などから情報システムを保護することによって，情報システムの信頼性，可用 性を確保することを理解する。","通信データの盗聴，不正接続を防ぐセキュアプロトコルの種類と効果を理解する。","なりすましによる不正接続，サービスの不正利用を防ぐ認証・認可技術の種類と効果を理解する。","OS のセキュリティや，セキュリティを強化した OS であるセキュア OS の仕組み，実装技術，効果を理解する。","ネットワークに対する不正アクセス，不正利用，サービスの妨害行為などの脅威に対する対策の仕組み，実装方法，効果を理解する。","データベースに対する不正アクセス，不正利用，破壊などの脅威に対する対策の仕組み，実装方法，効果を理解する。","アプリケーションソフトウェアに対する攻撃を抑制するアプリケーションセキュリティの対策の仕組み，実装方法，効果を理解する。","利害関係者要件として定義された，利用の状況及び運用シナリオに基づいて機能的な境界を定義することを理解する。 システム化の目標，対象範囲（対象業務，対象部署）をまとめることを理解する。","利用者の業務処理手順，入出力情報要件，操作要件（システム操作イメージ）の定義など，業務，組織，利用者からの要求事項をシステム開発の項目に対応させ，明確に定義することを理解する。また，開発対象システムの具体的な利用法を調査，分析して要件を抽出し，5W2H（Why，When，Where，Who，What，How，How much）の観点から明確に文書化することを理解する。 システム構成要件，設計及び実装の制約条件，UX（User Experience）を考慮した要件 の定義，適格性確認要件（開発するシステムが利用可能な品質であることを確認する基準）の定義，開発環境の検討などを行うことを理解する。","システム要件を評価する際の基準を理解する。また，システム要件定義書の作成後，システムの取得者及び供給者が共同でレビューを行うことを理解する。","ソフトウェア要件定義では，業務モデル，論理データモデルを作成して，システムを構成するソフトウェアの境界，ソフトウェアに求められる機能，能力，インタフェースなどを決定し，ソフトウェア要件を定めることを理解する。また，要件定義のための業務分析には，DFD，E-R 図，UML などの分析，表現方法を使用することを理解する。 ソフトウェアの機能仕様とそのインタフェースの仕様を識別する一連の活動と留意事項を理解する。 業務フローやサブシステム間の関係から業務モデルとデータモデルを作成する一連の活動と留意事項，データモデルの種類と各々の特徴を理解する。 企業の情報セキュリティポリシーに即したセキュリティ機能に関する設計原則及び設計特性を選定して優先順位をつける活動と留意事項を理解する。 運用開始後の新機能の追加及び既存機能の変更に必要な工数を抑え，機敏性を獲得するための設計上の配慮の必要性を理解する。","決定したソフトウェア要件がシステム要件に合致しているか，実現可能かなど，ソフトウェア要件を評価する際の基準，ソフトウェア要件定義書の作成後，システムの取得者及び供給者が共同でレビューを行うことを理解する。","ソフトウェアに何が要求されているかを明らかにし，理解するためには，利用者からのヒアリングが有効であること，ヒアリング実施の手順，考え方を理解する。 ユースケースは，一つの目標を達成するための利用者とシステムのやり取りを定義するために用いること，その特徴，目的，ユースケースを描く方法を理解する。 ソフトウェア要求分析において，外部仕様の有効性，仕様の漏れ，実現可能性などの評 価を行い，手戻りを防ぐためにモックアップ及びプロトタイプを作成することがあること，モックアップ及びプロトタイピングの特徴を理解する。 業務プロセスをデータの流れに着目して表現する場合に，DFD を使用することを理解する。 業務で扱う情報を抽象化し，実体（エンティティ）と実体間の関連（リレーションシップ）を表現する場合に，E-R 図を使用することを理解する。 オブジェクト指向設計の標準化された表記法として UML があること，UML で用いる図式の種類，特徴，UML を用いてシステムの仕組みを表現する方法を理解する。 ソフトウェア要件を記述する方法としてユーザーストーリーがあることを理解する。 その他，業務分析や要件定義に用いられる手法を理解する。","システム設計では，システム要件をハードウェア，ソフトウェア，手作業に振り分け，それらを実現するために必要なシステムの構成品目を決定すること，システム要求仕様が実現できるか，リスクなどを考慮した選択肢の提案は可能か，効率的な運用及び保守ができるかなど，システムを設計する際に考慮すべき点を理解する。 ハードウェア，ソフトウェア，サービス，手作業の機能分割を，業務効率，作業負荷，作業コストなどの観点から検討し，決定することを理解する。 信頼性や性能要件に基づいて，冗長化やフォールトトレラント設計，サーバの機能配分，信頼性配分などを検討し，ハードウェア構成を決定することを理解する。 システムの供給者が自社で全て開発するか，ソフトウェアパッケージなどを利用するかなどの方針，使用するミドルウェアの選択などを検討し，ソフトウェア構成を決定することを理解する。 業務に応じて集中処理，分散処理を選択すること，Web システム，クライアントサーバシステムなど，システムの処理方式を検討し，決定することを理解する。 システムで使用するデータベースの種類，信頼性を考慮して冗長化したレプリケーションなどを検討し，決定することを理解する。","システム設計に対し，システム統合テストの範囲，テスト計画，テスト手順などの方針を検討し，システムが機能を全て満たしているかどうかを確認するシステム統合テスト仕様書を作成することを理解する。","決定したアーキテクチャ及びシステム要素がシステム要件に合致しているか，実現可能かなど，システム要素を評価する際の基準を作成し，システムの取得者及び供給者が共同でレビューを行うことを理解する。","ソフトウェア設計では，ソフトウェア要件定義書を基に，開発側の視点からソフトウェアの構造とソフトウェア要素の設計を行うこと，ソフトウェア要素をソフトウェアユニット（プログラム）まで分割し，各ソフトウェアユニットの機能，ソフトウェアユニット間の処理の手順や関係を明確にすること，ソフトウェア設計書作成の構成，記述上の留意事項を理解する。 インタフェース設計では，ソフトウェア要件定義書を基に，操作性，応答性，視認性，ハードウェア及びソフトウェアの機能，処理方法を考慮して，入出力装置を介して取り扱われるデータに関する物理設計を行うことを理解する。 ソフトウェアユニット機能仕様書で提示された要件を全て満たしているかどうかを確認するために，テストの範囲，テスト計画，テスト方式を定義し，ソフトウェアユニットのテスト仕様書を作成することを理解する。 ソフトウェア設計書で提示された要件を全て満たしているかどうかを確認するために，テストの範囲，テスト計画，テスト方式を定義し，ソフトウェア統合テスト仕様書を作成することを理解する。","ソフトウェア要素がソフトウェア要件に合致していること，ソフトウェア要素間やソフトウェアユニット間の内部一貫性などのソフトウェア要素を評価する際の基準を理解する。また，ソフトウェア設計書について，作成後にレビューを行うことを理解する。","JIS X 25010 で規定されているシステム及びソフトウェア製品の品質特性を理解し，要件定義や設計の際には品質特性を考慮することを理解する。 システムとの対話による成果に関係する五つの特性である，利用時の品質モデルを理解する。 システム及び／又はソフトウェア製品の品質特徴（品質に関係する測定可能な特徴とそれに伴う品質測定量）を八つに分類した製品品質モデルを理解する。また，各特性は関連する副特性の集合から構成されていることを理解する。","プロセス中心設計手法によるソフトウェア設計の考え方と手順を理解する。 データ中心設計手法によるソフトウェア設計の考え方と手順を理解する。","機能分割と構造化の手順（機能の洗い出し，データフローの明確化，機能のグループ化，階層構造化，プログラム機能の決定，機能仕様の文書化），構造化設計による機能分割の利点，留意事項を理解する。","構造化設計で用いられる手法として，流れ図，DFD，構造化チャート，状態遷移図などがあることを理解する。","オブジェクト指向設計の考え方，手順，手法を理解する。 ドメイン駆動設計の考え方，手順，手法を理解する。","ソフトウェア要素を分割する際の基準には，処理パターン適用，処理タイミングの違い，処理効率の違い，同時使用可能資源，入出力装置の特徴などがあることを理解する。また，基準ごとの特徴を理解する。 プログラム分割の基準を理解する。","分割手法には，データの流れに着目した手法とデータ構造に着目した手法があり，内部処理の形態に応じて複数の分割手法を組み合わせること，分割手法の種類，特徴を理解する。 モジュールの独立性の評価基準として，モジュールの結束性（強度），結合度，それらと独立性との関係，分割量の評価基準，部品化と再利用のための評価基準を理解する。 各モジュール仕様の作成の考え方，手順，モジュール仕様の作成に用いられる手法を理解する。","ソフトウェアの部品化と再利用の必要性，部品の種類と特徴，部品設計の留意事項，ソフトウェアパッケージの利用法を理解する。","アーキテクチャパターンはソフトウェア構造のパターンであることなどの特徴を踏まえて，アーキテクチャパターンを利用する利点，留意事項を理解する。","デザインパターンは主にオブジェクト指向設計に用いられ，生成に関するパターン，構造に関するパターン，振る舞いに関するパターンの 3 種類に分類されることなどの特徴を踏まえて，デザインパターンを利用する利点，留意事項を理解する。","プロジェクト活動の状況や成果物を適宜評価するためのレビューの目的を理解する。また，レビューは文書の作成，レビューの実施（レビュー方式の決定，レビューの評価基準の決定，レビュー参加者の選出），レビュー結果の文書への反映作業という手順で行われることを理解する。 レビューの対象，実施タイミング，種類を理解する。 レビューで確認する妥当性評価の項目を理解する。 測定器やテストプログラムの利用によるデータ実測，利用者の意見や感想の収集など，レビュー以外の妥当性評価の手法を理解する。","実装・構築では，ソフトウェアユニットの作成，テスト手順及びテストデータの作成，ソフトウェアユニットのテストの実施，利用者用文書類の更新，ソフトウェア統合テスト要件の更新，ソフトウェアコード及びテスト結果の評価を実施することを理解する。","定められたコーディング標準，プログラム言語の仕様に従い，ソフトウェアユニット機能仕様書に基づいてプログラミングを行うことを理解する。","ソフトウェアコードとテスト結果を評価する際の基準を理解する。また，ソフトウェアユニットの作成，ソフトウェアユニットのテスト実施後，レビューを行うことを理解する。","コーディング標準の目的を理解する。また，コーディング標準には具体的にどのような内容を含めるか，コーディング標準を守らない場合にどのような弊害が起こるかを理解する。","コーディング支援手法の特徴と，利用する利点，留意事項を理解する。","コードレビューの目的，方法を理解する。また，コーディング標準を守っているか，ソフトウェア詳細設計書に基づいているか，効率性や保守性が適切かなどを確認することを理解する。","デバッグの方法，留意事項，机上デバッグと実際にソフトウェアを動作させて行うデバッグの特徴，各種開発ツールを用いたデバッグ方法を理解する。","ソフトウェアユニットのテストは，ソフトウェア設計で定義したテスト仕様に従って行い，要求事項を満たしているかどうかを確認することを理解する。 テストの目的，方針，スケジュール，体制，使用するテストツールなどを決定してテスト計画を立て，次にテスト項目，テストデータの作成，テスト環境の用意などのテスト準備を行い，テストを実施し，テスト結果を評価するという一連の手順を理解する。 テストの目的，実施方法，留意事項，テストで使用されるテストツールの役割を理解する。また，テストの実行後には，テスト結果の記録，結果分析，プログラムの修正や改良作業を行うことを理解する。 テストで用いられるブラックボックス法，ホワイトボックス法のテストデータの作成方法を理解する。","ソフトウェア統合では，ソフトウェア統合計画の作成，ソフトウェア統合，ソフトウェア統合テストの実施，利用者用文書類の更新，ソフトウェア統合の評価，ソフトウェア統合の共同レビュー，ソフトウェア検証テストの準備を実施することを理解する。","ソフトウェア検証テストでは，ソフトウェア検証テストの実施，利用者用文書類の更新，ソフトウェア検証テストの評価，ソフトウェア検証テストの共同レビューの実施，監査の支援，納入ソフトウェア製品の準備を実施することを理解する。","ソフトウェア統合では，統合する順序に基づいてソフトウェア統合計画を作成し，構築されたソフトウェアを統合することを理解する。","ソフトウェア統合テストはソフトウェア設計で定義したテスト仕様に従って行い，ソフトウェアの動作を確認すること，ソフトウェア統合テストの実施時期，実施手順，評価の基準を理解する。","ソフトウェア検証テストはソフトウェア要件定義で定義したソフトウェア要件に従って行い，ソフトウェアが要件どおりに実現されているかを検証することを理解する。","テストの実施後には，テスト結果の記録，結果の分析及び評価，プログラムの修正や改良作業を行い，必要に応じてソフトウェア設計書，利用者用文書類を更新することを理解する。 ソフトウェア統合を評価する際の基準を理解する。 ソフトウェア検証テストを評価する際の基準を理解する。","システム統合では，システム統合計画の作成，システム統合，システム統合テストの実施，利用者用文書類の更新，システム統合の評価，システム統合の共同レビュー，システム検証 テストの準備を実施することを理解する。","システム検証テストでは，システム検証テストの実施，システムの評価，システム検証テストの共同レビューの実施，利用者用文書類の更新，監査の支援，納入可能なシステムの準備，運用及び保守に引き継ぐシステムの準備を実施することを理解する。","システム統合テストはシステム設計で定義したテスト仕様に従って行い，ソフトウェア構成品目，ハードウェア構成品目，手作業及び必要に応じてほかのシステムを全て統合したシステムが要件を満たしているかどうかを確認すること，システム統合テストの実施時期，実施手順，評価の基準を理解する。","システム検証テストはシステム要件定義で定義したシステム要件に従って行い，システムが要件どおりに実現されているかどうかを確認することを理解する。","テストの実施後には，テスト結果の記録，結果の分析及び評価，システムのチューニングを行い，必要に応じて文書の更新を行うことを理解する。 システム統合を評価する際の基準を理解する。","システム及び／又はソフトウェアの受入れ支援では，取得者の受入れレビューや受入れテストの支援，納入，取得者への教育訓練及び支援を実施することを理解する。","システム及び／又はソフトウェアの導入に先立って，実環境への導入及び新旧のシステム及び／又はソフトウェアの移行をどのように実施するのか，データ保全や業務への影響などの留意事項は何か，スケジュールや体制はどのようにするかなど，導入計画を作成，文書化することを理解する。 システム及び／又はソフトウェアの導入計画に従って導入を行うこと，その際の留意事項を理解する。また，システム及び／又はソフトウェア，データベースなどを契約で指定されたとおりに初期化などを行い，実行環境を整備すること，導入時の作業結果を文書化することを理解する。 システム及び／又はソフトウェアの導入に当たり，利用者を支援する作業を理解する。","システム及び／又はソフトウェアの供給者は，取得者による受入れレビューやテストを支援すること，受入れレビューやテストの目的，どのように実施するのかを理解する。また，取得者は，供給者の受入れ支援を受け，共同レビュー，システム及び／又はソフトウェアの妥当性確認テストの結果を考慮して，受入れの準備，受入れレビュー，テストを行い，結果を文書化することを理解する。 システム及び／又はソフトウェアの供給者，取得者は，契約で示されたとおりにシステム及び／又はソフトウェアが完成していることを相互に確認して納入し，受け入れることを理解する。 システム及び／又はソフトウェアの供給者は，取得者に対して，初期及び継続的な運用のための教育訓練，支援を提供すること，取得者は供給者の支援を受けて体制の整備，教育訓練の計画，実施を行うことを理解する。また，教育訓練の目的，内容，準備，体制，結果の評価方法を理解する。 システム及び／又はソフトウェアの取得者の業務，コンピュータ操作，システム運用などの手順を利用者用文書類（利用者マニュアル）として文書化すること，利用者用文書類（利用者マニュアル）はシステム設計時又はソフトウェア設計時に暫定版を作成し，開発の進行に従って適宜更新することを理解する。","定義した環境において妥当性確認テストの手順を実施することを理解する。 妥当性確認テストによって識別されたインシデント及び問題を記録し，それらの解決を追跡すること，及び妥当性確認されたシステム要素のトレーサビリティを維持することを理解する。 妥当性確認テストで用いる手法又は技法を理解する。","保守の目的やサービスレベルなどの保守を受ける側の要求，保守を提供する側の実現性や費用を考慮して，保守要件を決定することを理解する。また，保守では問題の発生，改善，機能拡張要求などへの対応として，既存システム及び／又は既存ソフトウェアの安全性を維持しつつ修正や変更を行うことを理解する。","廃棄では，運用及び保守の組織によって実施中の支援を終えるか，又は影響を受けるシステム若しくはソフトウェアを最終の状態にし，かつ，廃棄しても運用に支障のない状態にして，起動不能にしたり，解体したり，取り除いたりすることを理解する。","保守をどのように実施するか，保守のタイプ及び形態，その際の留意事項，実施内容，方法の違いなどを理解する。","保守業務開始のための準備を行うことを理解する。 保守対象のシステム及び／又はソフトウェアの問題や改善要求を解決する過程を理解する。 修正部分が決まった後，修正を実施する過程を理解する。 修正されたシステム及び／又はソフトウェアの動作確認や完了の承認を行うことを理解する。 問題の再発防止のため，特性要因分析などを実施することによって，根本原因の抽出，類似事故の発生の可能性を検討し，システム及び／又はソフトウェアの改善やマニュアルなどの改訂を行うことを理解する。 システム移行及び／又はソフトウェア移行の手順，システム及び／又はソフトウェアの完全性の維持，業務への影響など移行の際の留意事項を理解する。","システム及び／又はソフトウェアの導入や更新などに伴い，不要となったシステム及び／又はソフトウェアの廃棄の手順を理解する。","ソフトウェア開発の効率化や品質向上のために用いられるソフトウェア開発モデルの考え方，必要性を理解し，ソフトウェア開発モデルの特徴を理解する。 迅速かつ適応的にソフトウェア開発を行う軽量な開発手法であるアジャイルの特徴を理解する。","アジャイルの概要として，アジャイルソフトウェア開発手法の種類などを理解する。","XP（エクストリームプログラミング）の特徴を理解する。","スクラムの特徴を理解する。 開発チームと運用チームが連携し，迅速かつ柔軟にソフトウェア開発を行うDevOps の特徴を理解する。 専門的なコーディングの知識や経験がなくてもソフトウェアの開発が可能となるローコード／ノーコード開発の特徴，利点，留意事項を理解する。 ソフトウェアの開発生産性や品質向上のためには，部品化や再利用が必要であり，部品化を進める際には，部品は再利用されるという前提に立って設計や作成に取り組む必要があること，ソフトウェアパッケージを活用することによって，開発生産性や品質向上が可能になることなどを理解する。また，ソフトウェア部品の種類，特徴，部品設計のポイントを理解する。","ソフトウェア部品の種類と特徴を理解する。","既存のソフトウェアを解析して，仕様や構成部品などの情報を得るリバースエンジニアリングがあること，リバースエンジニアリングの結果に基づいて，元のソフトウェアの権利者の許可なくソフトウェアを開発，販売すると，元の製品の知的財産権を侵害する可能性があること，利用許諾契約によっては，リバースエンジニアリングを禁止している場合もあることなどを理解する。 マッシュアップは，複数の提供元による API を組み合わせることで，新しいサービスを構築する手法であることを理解する。また，マッシュアップの考え方，生産性，品質面での特徴，留意事項を理解する。 モバイルアプリケーションソフトウェア開発の手順，留意事項を理解する。","大規模なシステムや複雑な処理内容に対して適切な品質を確保し，また，プログラムの保守を容易にするために構造化手法が用いられること，構造化手法の考え方，特徴，手順，効果，留意事項を理解する。","","SLCP（Software Life Cycle Process：ソフトウェアライフサイクルプロセス）の目的と全体像を理解する。 開発と保守のプロセスを評価，改善するに当たって，システム開発／ソフトウェア開発を行う組織のプロセス成熟度の水準を識別するための成熟度モデルがあること，プロセスの能力を 6 段階で定義して進化の道筋を示した能力水準や進化レベルの内容，より高次のレベルに達するために必要な方策を理解する。","開発するソフトウェアの著作権の帰属の考え方を理解し，プログラムを外注する場合の留意事項を理解する。","ソフトウェア開発工程で発生した発明を保護するための手順を理解する。ソフトウェア開発時に他者のもつ特許を利用する必要が生じた場合は，使用許諾を受ける必要があることを理解する。","ソフトウェア開発時に，自社が権利を所有しないソフトウェアを利用する必要が生じた場合はライセンスを受ける必要があること，獲得したライセンスについては使用実態や使用人数がライセンス契約で託された内容を超えないよう管理する必要があることを理解する。","ソフトウェアやコンテンツなどの知的財産を技術的に保護する手法の特徴，効果，留意事項を理解する。","効率的な開発のためには，開発用ハードウェア，ソフトウェア，ネットワーク，シミュレーターなどの開発ツールを開発要件に合わせて準備することを理解する。","効率的な開発のためには，コンピュータ資源，開発支援ツールなど適切な開発環境の準備が必要であること，また資源の稼働状況を適切に把握，管理することを理解する。 設計に関わる様々なデータのバージョン管理，プロジェクトでの共有管理，安全管理など，設計データを管理することを理解する。また，企業機密や個人情報が含まれているデータは，誰がいつ何の目的で利用したのか，不適切な持出しや改ざんがないかなどを厳重に管理することを理解する。 多数の人が開発に携わる場合，開発に利用するツールやバージョンが異なることによって，作成したソフトウェアの互換性の問題が生じるおそれがあることを理解する。また，ツールに起因するバグやセキュリティホールの発生など，ツールの選択によって開発対象のソフトウェアの信頼性に影響を及ぼすおそれがあるので，使用するツールやバージョンの統一などツールを管理することを理解する。 ライセンス条項に違反した利用は不正利用に当たり，不正利用は違法行為として法的処罰の対象となることを理解する。また，ライセンスの内容を理解し，定期的にインストール数と保有ライセンス数を照合確認するなど，適正に使用しているかどうかを確認することを理解する。","構成管理では，ソフトウェア全体がどのような構成品目の組み合わせで構成されているかという構成識別体系を確立し，その構成識別体系の管理の方法を明らかにした上で管理を行うことを理解する。","基準になっているソフトウェア構成品目について，状況や履歴を管理し文書化すること，プロジェクトにおける変更回数，最新のバージョン，移行状況などの当該文書に記録する 内容を理解する。 ソフトウェア構成品目の機能的な完全性と物理的な完全性を決定，保証することであること，及びその必要性を理解する。 ソフトウェア構成品目の完全性が保証された後は，ソフトウェアや関連文書の新しい版の出荷などの手続を行うこと，ソフトウェアのコードや文書はソフトウェアの寿命のある間保守することを理解する。","プロジェクトは，プロジェクトの目標を達成するために遂行する，開始日と終了日とをもち，調整し，かつ，管理する活動で構成するプロセスの独自性のある集合であることを理解する。また，プロジェクトマネジメントとは，方法，ツール，技法及びコンピテンシーを，あるプロジェクトに適用することであり，複数のプロセスを通じて遂行するものであることを理解する。 プロジェクトで使用するプロセスの三つの主な種類の目的，役割，機能を理解する。 プロジェクトマネジメントの五つのプロセス群の目的，役割，機能を理解する。 プロジェクトマネジメントの十の対象群を理解する。","プロジェクトの体制の種類，特徴，役割，責任分担を理解する。 プロジェクトの体制の中で，自ら管理すべき，内容，計画，作業，報告・連絡・相談などを理解する。","統合の対象群には，プロジェクトに関連する様々な活動及びプロセスを特定し，定義し，組み合わせ，一体化し，調整し，管理し，更に終結するために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","統合の対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","統合の対象群が含むプロセスに関連するツールと技法などを理解する。","ステークホルダの対象群には，プロジェクトスポンサー，顧客及びその他のステークホルダを特定し，マネジメントするために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","スコープの対象群には，作業及び成果物のうち必要とするものだけを特定し，定義するために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","","スコープの対象群が含むプロセスに関連するツールと技法などを理解する。","資源の対象群には，人員，施設，機器，材料，インフラストラクチャ，ツールなど，適切 なプロジェクト資源を特定し，得るために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","資源の対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","資源の対象群が含むプロセスに関連するツールと技法などを理解する。","時間の対象群には，プロジェクト活動のスケジュールを立て，進捗状況を監視してスケジュールを管理するために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","時間の対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","時間の対象群が含むプロセスに関連するツールと技法などを理解する。","コストの対象群には，予算を作成し，進捗状況を監視してコストを管理するために必要な プロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","","コストの対象群が含むプロセスに関連するツールと技法などを理解する。","リスクの対象群には，脅威及び機会を特定し，マネジメントするために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","","リスクの対象群が含むプロセスに関連するツールと技法などを理解する。","品質の対象群には，品質の保証及び管理を計画し，確定するために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","品質の対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","品質の対象群が含むプロセスに関連するツールと技法などを理解する。","調達の対象群には，製品，サービス又は結果を計画し，入手し，供給者との関係をマネジメントするために必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","調達の対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","調達の対象群が含むプロセスに関連するツールと技法などを理解する。","コミュニケーションの対象群には，プロジェクトに関連する情報の計画，マネジメント及び配布に必要なプロセスを含む。それらのプロセスの目的，役割，機能，プロセス間の関連などを理解する。","コミュニケーションの対象群が含むプロセスの主要なインプット及びアウトプットを理解する。","コミュニケーションの対象群が含むプロセスに関連するツールと技法などを理解する。","サービスマネジメントは，価値を提供するため，サービスの計画立案，設計，移行，提供及び改善のための組織の活動及び資源を，指揮し，管理する，一連の能力及びプロセスであることを理解する。","サービスマネジメントシステムを確立し，実施し，維持し，継続的に改善するための組織に対する要求事項について，JIS で規定していることを理解する。","サービスレベル合意書（SLA：Service Level Agreement）は，サービス及びその合意されたパフォーマンスを特定した，組織と顧客との間の合意文書であることを理解する。また，代表的なサービスレベル目標を理解する。","サービスマネジメントシステムの計画を作成，実施及び維持することを理解する。また，サービスマネジメントシステム及びサービスの運用を支援するために必要な知識を決定し，維持することを理解する。","サービスの要求事項を決定し，利用可能な資源を考慮して，変更要求及び新規サービス又はサービス変更の提案の優先順位付けを行う。","顧客に提供するサービスについての文書化した情報として，サービスの意図した成果及びサービス間の依存関係を説明する情報を含めて，サービスカタログを作成し，維持することを理解する。また，顧客，利用者及びその他の利害関係者に対して，サービスカタログの適切な部分へのアクセスを提供することを理解する。","サービスマネジメントシステムの計画における要求事項及び義務を満たすため，サービスを提供するために使用されている資産を確実に管理することを理解する。","構成品目を識別，記録，制御，追跡及び検証し，サービスに関連する構成情報を管理することを理解する。また，定められた間隔で，構成情報の正確性を検証すること，必要に応じて，構成情報を他のサービスマネジメント活動で利用可能とすることを理解する。","顧客関係を管理し，顧客満足を維持し，顧客及び他の利害関係者との間のコミュニケーションのための取決めを確立することを理解する。また，サービスのパフォーマンス傾向及びサービスの成果のレビューを行い，サービス満足度の測定，サービスに対する苦情の管理を行うことを理解する。","サービスレベルを定義，合意，記録及び管理するために，顧客と提供するサービスについて SLA を合意することを理解する。また，あらかじめ決められた間隔で，サービスレベル目標に照らしたパフォーマンス及び実績の周期的な変化を監視し，レビューし，報告する。","外部供給者の管理として，外部供給者との関係，契約及び外部供給者のパフォーマンスを監視することを理解する。内部供給者及び供給者として行動する顧客の管理として，サービスレベル目標及び関係者間のインタフェースを定義するための合意文書を作成し，合意すること，及びパフォーマンスを監視することを理解する。","財務管理の方針及びプロセスに従ってサービスの予算業務及び会計業務を行うこと，費用 はサービスに対して効果的な財務管理及び意思決定ができるように予算化すること，及びあ らかじめ定めた間隔で，予算に照らして実際の費用を監視・報告し，財務予測をレビューし，費用を管理することなどを理解する。","あらかじめ定めた間隔で，サービスに対する現在の需要を決定し，将来の需要を予測すること，及びサービスの需要及び消費を監視し報告することを理解する。","資源の容量・能力の要求事項を，決定し，サービスに対する需要に基づいた現在及び予測される容量・能力を計画し，提供することを理解する。また，容量・能力の利用を監視し，容量・能力及びパフォーマンスデータを分析し，パフォーマンスを改善するための機会を特定することを理解する。","変更管理が管理するサービスコンポーネント及び他の品目，緊急の変更を含む変更のカテゴリ及び管理の方法，及び顧客又はサービスに重大な影響を及ぼす可能性のある変更を判断する基準を定義することを理解する。 変更管理の開始では，サービスの追加，廃止又は提案を含む変更要求を記録・分類し， “サービスの設計及び移行”又は“変更管理の活動”のどちらで変更の管理を行うかを 決定することを理解する。 変更管理の活動では，主に次を行うことを理解する。 ・変更要求の優先度を決定する。 ・リスク，事業利益，実現可能性及び財務影響を考慮し，変更要求を承認する。 ・承認された変更を，計画，開発（構築）及び試験する。 ・成功しなかった変更を戻す又は修正する活動を計画し，可能であれば試験する。 ・試験された変更は，リリース及び展開管理に送られ，稼働環境に展開する。","サービス計画で決定した新規サービス又はサービス変更についてのサービスの要求事項を用いて，新規サービス又はサービス変更の計画を立案することを理解する。 サービス計画で決定したサービスの要求事項を満たすように，設計し，文書化することを理解する。また，SLA，サービスカタログ，契約書などの新設，更新を行うことを理解する。 文書化した設計に適合する構築を行い，サービス受入れ基準を満たしていることを検証するために，試験することを理解する。リリース及び展開管理を使用して，新規サービス又はサービス変更を，稼働環境に展開することを理解する。","新規サービス又はサービス変更，及びサービスコンポーネントの稼働環境への展開について計画し，実施することを理解する。また，リリースの成功又は失敗を監視し，改善の機会を特定するために，分析から導き出された結果をレビューすること，及びリリースの成功又は失敗に関する情報や将来のリリース期日についての情報を，適切な他のサービスマネジメント活動のために利用可能にすることを理解する。","重大なインシデントを特定する基準を決定することを理解する。また，重大なインシデントは，文書化された手順に従って分類し，管理し，トップマネジメントに通知することを理解する。","サービス可用性のリスクのアセスメントを行うこと，及びサービス可用性の要求事項及び目標を決定することを理解する。また，サービス可用性を監視し，結果を記録し，目標と比較すること，計画外のサービス可用性の喪失を調査し，必要な処置をとることを理解する。","サービス継続のリスクのアセスメントを行うこと，及びサービス継続の要求事項を決定し，サービス継続計画を作成し，実施し，維持することを理解する。また，サービス継続計画は，あらかじめ定めた間隔又はサービス環境に重大な変更があった場合，試験することを理解す る。","サービスマネジメントの目的に照らしてサービスマネジメントシステムのパフォーマンスと有効性を評価すること，また，サービスの要求事項に照らして，サービスの有効性を評価することを理解する。 報告の要求事項及び目的を決定し，サービスマネジメントシステム及びサービスのパフォーマンス並びに有効性に関する報告を作成することを理解する。","不適合が発生した場合に，不適合を管理し修正するための処置をとること，不適合によって起こった結果に対処すること，不適合が再発しないようにするための処置の必要性を評価すること，必要な処置を実施することを理解する。 サービスマネジメントシステム及びサービスの適切性，妥当性及び有効性を継続的に改善すること，改善の機会に対して適用する評価基準を決定すること，承認された改善活動を管理することを理解する。","システムの運用管理では，日常の運用計画，障害発生時運用を適切に行うための計画，運用負荷低減のための改善計画などに加えて，容量・能力管理，情報セキュリティ管理，サービス可用性管理及びサービス継続管理の方針を受けて実施する活動があることを理解する。また，運用の資源管理では，サービスを構成する設備，コンピュータシステム，データ，マニュアル，作成した成果物，及びシステムを運用する要員を，組織の目標と適合するように維持，運用する一連の活動であることを理解する。","システムを安定稼働させるために，定められた手順に沿ってシステムの監視・操作・状況連絡を実施することを理解する。システムの操作に当たっては，作業指示書に従って実施することを理解する。また，ジョブスケジューリング，アウトプット管理，バックアップといった運用オペレーションの内容を理解する。","サービスデスクは，サービスの利用者からの問合せに対して単一の窓口機能を提供し，適切な部署への引継ぎ，対応結果の記録，記録の管理などを行う一連の活動であることを理解する。","コンピュータシステムやネットワークの施設基盤の設計，構築の管理及び運営におけるファシリティマネジメントの目的，考え方を理解する。 データセンターなどの施設やコンピュータ，ネットワークなどの設備の管理によって， 費用の削減，快適性，安全性などを確保することを理解する。また，電源や回線の冗長化，バックアップ環境の整備，電源，空調設備，建物などのアクセス管理などを理解する。 施設・設備を適正な状態に維持保全することを理解する。また，水道光熱費，保守・メ ンテナンス費，修繕費などを含めたライフサイクル費用の削減を目指して，修繕計画を立 案し，施設・設備の長寿命化を図るなど，施設・設備の維持保全の一連の活動を理解する。 地球環境に配慮したIT 製品やインフラストラクチャ，環境保護や資源の有効活用につながる IT 利用を理解する。","情報システムに関係する監査の目的，種類を理解する。","システム監査の目的は，情報システムに係るリスク（情報システムリスク）に適切に対応しているかどうかを，高い倫理観をもった，独立かつ客観的な立場のシステム監査人が検証・評価し，もって保証や助言を行うことを通じて，組織体の経営活動と業務活動の効果的かつ効率的な遂行，さらにはそれらの変革を支援し，組織体の目標達成に寄与すること，及び利害関係者に対する説明責任を果たすことであることを理解する。 システム監査は，監査計画の策定，監査の実施，監査報告とフォローアップという流れで行われることを理解する。","システム監査の対象業務は，情報システムのコントロールとマネジメントだけでなく，ガ バナンスにまで及ぶことを理解し，さらに，情報システムの企画・開発（アジャイル開発を 含む）・運用・保守・廃棄のプロセス，外部サービスの調達・利活用のプロセスなどに及ぶ  ことから，各プロセスで評価する内容を理解する。また，システム監査を実施する目的及び 対象範囲は，監査規程，契約書などの文書，監査計画によって明確に定めることを理解する。","有効かつ効率的な監査を行うために，システム監査人は監査の目的・テーマ，監査対象範囲，監査の方法，実施時期，実施体制，実施スケジュールなどの監査計画を策定することを理解する。","予備調査，本調査，結論の形成の一連の監査プロセスを理解する。 システム監査手続で利用される，代表的なシステム監査技法を理解する。 監査ソフトウェアなどを利用してシステム監査を実施する，コンピュータ支援監査技法を理解する。 監査証拠とは，システム監査人の監査の結論を裏付けるために必要な情報であることを理解する。また，監査の結論を裏付けるためには，適切かつ慎重に監査手続を実施し，十分かつ適切な監査証拠を入手する必要があることを理解する。監査の実施において監査証拠を監査人が円滑に入手できるように，情報システムが構築，整備されていることが望ましいことを理解する。また，監査対応のためだけのドキュメント作成を開発現場に求めるような負荷をかけないよう考慮することが望ましいことを理解する。 システム監査人は，調査，収集，検証・評価した情報を，監査の結論に至った過程が分かるよう整理して文書化した監査調書を作成，保管し，監査報告書を作成するときの基礎資料や監査結果の裏付けとすることを理解する。 システム監査は，公認会計士による監査，監査役などによる監査，内部監査人による監査などと関係があることを理解する。","システム監査人は，監査目的に応じた適切な形式で，監査結果を監査の依頼者や適切な関係者に報告すること，報告書に記載した改善提案又は監査対象先が作成した改善計画について，所要の措置が適切かつ適時に実施されているかどうかのフォローアップを行うことを理解する。","システム監査に対するニーズを満たしているかどうかを含め，一定の監査品質を確保するための体制の整備・運用が必要であることを理解する。","情報セキュリティ監査の目的，役割を理解する。 品質，環境，サービス，情報セキュリティ，事業継続などの各種マネジメントシステムを対象とするマネジメントシステム監査の目的，役割を理解する。","システム監査における監査人の倫理は，経済産業省が策定したシステム監査基準によって規定されていることを理解する。また，システム監査の判断尺度を確定する際の客観的な参照基準として，経済産業省が策定したシステム管理基準などを用いることができることを理解する。 情報セキュリティに関する法律，情報セキュリティ監査の対象組織，情報システムに及ぼす影響を理解する。 個人情報保護に関する法律やガイドライン，個人情報保護におけるシステム監査の役割を理解する。 知的財産権に関する法律，システム監査では権利侵害行為を指摘する必要性があることを理解する。 労働に関する法律，システム監査では法律に照らして労働環境における問題点を指摘する必要があることを理解する。","内部統制とは，健全かつ効率的な組織運営のための体制を企業などが自ら構築し運用する仕組みであり，実現には業務プロセスの明確化，職務分掌，実施ルールの設定，チェック体制の確立が必要であることを理解する。また，IT が内部統制に果たす役割，内部統制の六つの基本的要素を理解する。","IT ガバナンスとは，組織体のガバナンスの構成要素で，取締役会等がステークホルダのニーズに基づき，組織体の価値及び組織体への信頼を向上させるために，組織体におけるIT の利活用のあるべき姿を示すIT 戦略と方針の策定及びその実現のための活動であることを理解する。また，システム監査，情報セキュリティ監査，ソフトウェア資産管理などIT ガバナンスを実現するための取組を理解する。また，IT ガバナンスの評価のために使用されるフレームワークを理解する。","情報システムの構築・運用は，当該業務システムに関わる法令を遵守して行わなければならないこと，適切なタイミングと方法で法令，基準，自社内外の行動規範の遵守状況を継続的に評価し，改善していく必要があること，内部統制を整備することが法令遵守の体制を確立する上で有効であることを理解する。","経営戦略に沿って効果的な情報システム戦略を策定すること，情報システム戦略に基づいて情報システム化基本計画を策定すること，情報システム戦略遂行のための組織体制などを理解する。 情報システム戦略を策定する際の手順を理解する。 情報システム戦略を策定する際の留意事項を理解する。 情報システムで目指すべき将来像を，中長期の情報システム化基本計画としてまとめる必要性を理解する。 情報システム投資計画は，経営戦略との整合性を考慮して策定すること，計画の決定に際してその影響，効果，期間，実現性などの観点から複数の選択肢を検討する必要があることなどを理解する。 情報システム化基本計画に従って，優先順位を明確にして個別の開発計画（個別計画）を立案すること，企業の戦略性を向上させるためのシステムとして，企業全体又は事業活動の統合管理を実現するシステム，企業間の一体運営に資するシステムがあることを理解する。 企業経営システムのモデルを理解する。","EA（Enterprise Architecture：エンタープライズアーキテクチャ）は，組織全体の業務とシステムを統一的な手法でモデル化し，業務とシステムを同時に改善することを目的とした，組織の設計・管理手法であること，全体最適化を図るためのアーキテクチャモデルを作成し，目標を明確に定めることが必要であることを理解する。 アーキテクチャモデルは，業務とシステムの構成要素を記述したモデルのことで，組織全体として業務プロセス，業務に利用する情報，情報システムの構成，利用する情報技術の領域のアーキテクチャ（それぞれ，ビジネスアーキテクチャ，データアーキテクチャ，アプリケーションアーキテクチャ，テクノロジアーキテクチャと呼ばれる）を整理し，システム全体の現状と理想像を表現することを理解する。 BA（Business Architecture：ビジネスアーキテクチャ）は，組織の目標や業務を体系化したアーキテクチャであることを理解する。 DA（Data Architecture：データアーキテクチャ）は，組織の目標や業務に必要となるデータの構成，データ間の関連を体系化したアーキテクチャであることを理解する。 AA（Application Architecture：アプリケーションアーキテクチャ）は，組織としての目標を実現するための業務と，それを実現するアプリケーションソフトウェアの関係を体系化したアーキテクチャであることを理解する。 TA（Technology Architecture：テクノロジアーキテクチャ）は業務を実現するためのハードウェア，ソフトウェア，ネットワークなどの技術を体系化したアーキテクチャであることを理解する。","プログラムマネジメントは，目的や目標が明確な複数のプロジェクトを有機的に組み合わせたプログラムが，プロジェクト相互の関係を最適化して，全体として使命をより良く達成するように統合する活動であることを理解する。","情報システムでは，システムオーナーは情報システムの責任者を指し，データオーナーは情報システムが保有するデータに関する責任者を指すこと，及び関連する各部門の役割を理解する。","全社的な組織構造の中に情報システム関連の組織を組み込み，位置付けと使命を明確にするとともに，情報システムの統制についての要件を定義し，明確化することを理解する。また，フレームワークには，プロセスフレームワーク，コントロールフレームワークなどがあることを理解する。","情報システムにかかる標準に対する準拠性を確保し，継続的な遵守状況をモニタリングし，情報システムの品質を確保するための組織，体制，一連の活動であることを理解する。","情報システム戦略の実行状況をモニタリングし，情報システム戦略の実現を確保する一連の活動であることを理解する。","既存の組織構造や業務プロセスを見直し，効率化を図るとともに，情報技術を活用して業務・システムを最適化する考え方を理解する。 BPM（Business Process Management：ビジネスプロセスマネジメント）の目的，考え方，手順を理解する。また，業務分析，業務設計，業務の実行，モニタリング，評価のサイクルを繰り返し， 継続的な業務プロセスの改善を図ること， BPMS（ Business  Process Management System）の機能を理解する。 BPR（Business Process Reengineering：ビジネスプロセスリエンジニアリング）の目的，手順，考え方を理解する。 BPO（Business Process Outsourcing：ビジネスプロセスアウトソーシング）の目的，手順，考え方を理解する。 WFA（Work Flow Architecture：業務流れ図），BPD（Business Process Diagram：BP 図）， E-R 図などの手法を用いて業務プロセスを把握，分析して問題点を発見し，業務改善の提 案を行うことを理解する。","情報技術の進展，経営を取り巻く環境の複雑化によって，顧客の経営課題を解決するサービスを提案，提供するソリューションビジネスが発展したこと，ソリューションビジネスにおいてはサービスの提供を通じて，顧客の課題を探り解決策を提案すること，顧客との信頼関係の構築，維持が重要であることを理解する。","クラウドサービスの特徴，考え方，留意事項を理解する。 業種別，業務別，課題別など様々なソリューションサービスが提供されていること，及び代表的なサービスの種類と特徴，考え方，留意事項を理解する。","情報システムを有効に活用し，経営に活かすために，情報システムの構築時から活用促進，普及啓発活動を継続的に行い，情報システムの利用実態を評価，検証して改善していくこと，各活動の考え方，役割，手順を理解する。 経営目標の実現を目指して，デジタル技術を安全，有効，効率的に活用するために，デジタルリテラシーを確立することを理解する。 情報システムを活用するための教育・訓練の実施など，普及啓発活動を理解する。 情報システムの投資対効果分析，システム利用実態を調査し評価すること，及び業務内容，業務フローの変更の有無，システムの運用状況を把握し，評価，検証して改善の方向性と目標を明確化することを理解する。また，客観的な評価，検証を行うために外部専門家を活用することを理解する。 機能，性能，運用性，拡張性，コストなどの観点から評価，検証した結果，情報システムやソフトウェアが寿命に達していると判断した場合には，情報システムを廃棄し，新たな情報システムの導入などを検討する必要があること，廃棄に当たっては廃棄計画を策定するなどの適切な措置を講じた上で廃棄すること，廃棄の手順と留意事項を理解する。","システム化構想の立案の目的，考え方，手順を理解する。","","","全体開発スケジュールの目的，考え方を理解する。 要員教育計画の目的，考え方を理解する。 投資の意思決定に使用される手法の考え方，手順を理解する。 開発投資対効果を分析，検討する際の考え方を理解する。 情報システムの導入に伴うリスクの種類や大きさの分析を理解する。","要求項目の洗い出し，分析，システム化ニーズの整理，前提条件や制約条件の整理，という手順を理解する。 要求分析に用いられる代表的な手法やモデルの特徴を理解する。","要件定義の目的は，システムや業務全体の枠組み，システム化の範囲と機能を明らかにすることであることを理解する。 要件定義で明確化する内容を理解する。 構造化分析手法，オブジェクト指向分析手法を理解する。 定義された要件の実現可能性，妥当性，情報システム戦略との整合性などを検証し，利害関係者間で要件の合意と承認を得ることを理解する。","開発するシステムの用途，規模，取組方針，前提や制約条件に応じた調達方法を理解する。 要件定義を踏まえ，既成の製品又はサービスの購入，組織内部でのシステム開発，外部委託によるシステム開発などから調達方法を選択し，調達の対象，調達の要求事項，調達の条件などを定義して調達計画を策定することを理解する。 システム開発における外部資源活用の妥当性，外部資源活用の方法，特徴を理解する。 調達を適切に行う上で，システム資産及びソフトウェア資産を管理することが有効であることを理解する。","調達の代表的な方法，留意事項を理解する。 ベンダー企業に対し， システム化の目的や業務内容を示し， RFI （ Request For Information：情報提供依頼書）を作成することを理解する。 ベンダー企業に対し，調達対象システム，提案依頼事項，調達条件などを示した RFP（Request For Proposal：提案依頼書）及び RFQ（Request For Quotation：見積依頼書）を提示し，提案書，見積書の提出を依頼することを理解する。 ベンダー企業では，提案依頼書を基にシステム構成，開発手法などを検討し，提案書や見積書を作成して依頼元に対して提案することを理解する。 調達先の選定に当たっては，提案評価基準や要求事項適合度の重み付けを含め，選定の手順を確立し，ベンダー企業の提案書や見積書から，開発の確実性，信頼性，費用内訳，工程別スケジュール，最終納期などを比較評価して選定することを理解する。 調達に当たっては，内部統制，法令遵守，CSR（Corporate Social Responsibility：企業の社会的責任）調達，グリーン調達などの観点からのリスク管理の知識が必要であり，リスクを分析し，評価し，対策を立てる必要があることを理解する。また，調達のリスクを品質リスク，納期リスク，費用超過リスク，要員スキルに関するリスクなど，リスクの内容に合わせて分けられることを理解する。 選定したベンダー企業と契約について交渉を行い，納入システム，費用，納入時期，発注元とベンダー企業の役割分担などを確認し，契約を締結することを理解する。","経営戦略の目的，考え方，経営戦略の階層を理解する。","全社戦略の目的，考え方，代表的な戦略を理解する。 PPM（Product Portfolio Management：プロダクトポートフォリオマネジメント）の目的，特徴，手順を理解する。","競争戦略の目的，考え方，代表的な戦略を理解する。 SWOT（Strength，Weakness，Opportunity，Threat：強み，弱み，機会，脅威）分析の目的，特徴，手順を理解する。 VRIO 分析の目的，特徴，手順を理解する。 バリューチェーン分析の目的，特徴，手順を理解する。 成長マトリクスの目的，特徴，手順を理解する。","市場規模，顧客ニーズ，自社の経営資源，業績，競合関係などの分析を行うこと，その考え方，及び市場調査で用いられる代表的な調査，分析手法を理解する。 マーケティングミックスは，商品計画，販売価格，販売経路，販売促進を効果的に組み合わせて実施することであることを理解する。 顧客が，企業・製品・サービスとの全ての接点で経験するあらゆる体験において，精神的，主観的な満足を感じるための CX デザインの考え方や手法を理解する。 製品・サービスに接する顧客の体験価値だけではなく，顧客体験を継続的に実現するための組織や仕組みをデザインすることによって，新たな価値を創出するサービスデザインの考え方や手法を理解する。","PLC（Product Life Cycle：製品ライフサイクル）の各段階の特徴と実施すべきマーケティング戦略，製品ミックスの考え方，代表的な製品戦略を理解する。 商品の価格設定の手法，考え方，その効果を理解する。 流通経路の分類方法，選定する考え方，最適化する手法を理解する。 インターネット及び Web メディアによる広告，販売促進などの考え方と効果的な活用方法を理解する。","代表的なマーケティング手法の特徴，適した活用場面を理解する。","ビジネス戦略と目標，評価に関する目的，考え方，手順を理解する。 ［手順の例］(ⅰ)企業理念，企業ビジョン，全社戦略を踏まえ，ビジネス環境分析，ビジネス戦略立案を行い，具体的な戦略目標を定める，(ⅱ) 目標達成のために重点的に取り組むべき CSF（Critical Success Factors：重要成功要因）を明確にする，(ⅲ)目標達成の度合いを計るための指標を設定し評価する。","BSC（Balanced Scorecard：バランススコアカード）の目的，特徴，手順を理解する。 競合分析の目的，特徴，手順を理解する。 バリューエンジニアリング，シックスシグマなどの手法の目的，特徴，手順を理解する。","経営管理システムには，全社を対象としたシステム，特定の部門を対象としたシステムなどがあることを理解する。また，経営戦略実現のための経営管理システムに，経営者の意思決定を支援するシステムや事業活動の統合管理などを行うシステムがあること，特徴，考え方を理解する。","企業の持続的発展のためには，技術開発への投資とともにイノベーションを促進し，技術と市場ニーズとを結び付けて事業を成功へ導く技術開発戦略が重要であり，経営戦略や事業戦略と技術開発戦略との連携が重要であることを理解する。 技術開発を経済的価値へ結びつけるには，技術・製品価値創造（Value Creation），価値実現（Value Delivery），価値利益化（Value Capture）が重要であることを理解する。 技術開発戦略の立案に先立って必要な分析の内容，核となる技術を見極め，柔軟に外部資源を活用するなど，技術開発戦略の立案の考え方を理解する。 外部資源を戦略的に活用する手法，留意事項を理解する。","経営戦略や技術開発戦略に基づいて作成される技術開発計画の目的と内容，立案に当たっての考え方を理解する。","技術開発の具体的なシナリオとして，科学的裏付とコンセンサスのとれた未来像を時系列で描くロードマップの目的，考え方，種類，特徴を理解する。","情報システムがどのような社内業務に活用されているか，情報システムの特徴，代表例，動向を理解する。","業務を支援する代表的な情報システムの特徴，期待効果，情報システムの導入に伴う業務体制の見直しや費用対効果などの留意事項を理解する。また，ビジネスシステムの代表的なソフトウェアパッケージの特徴，代表例，動向を理解する。","行政で活用されている代表的な情報システムの種類，特徴を理解する。また，電子政府は，情報技術を活用して行政サービスの提供，行政活動の効率化などを行う仕組みであり，その 実現が重点政策課題の一つとされていること，特徴，動向，課題を理解する。","道路交通問題の解決を目指すシステム，通行料金を扱うシステムなど，公共分野における代表的な情報システムの特徴，代表例，動向を理解する。","AI をより良い形で社会実装し，共有するための基本原則（人間中心の AI 社会原則）な ど，AI 利活用に関する原則及び指針，並びに国内外の AI 政策・標準化の動向を理解する。 研究開発・調達・製造・物流・販売・マーケティング・サービス・金融・インフラ・公 共・ヘルスケアなど様々な領域（生産，消費，文化活動）で活用されているAI システム・ AI サービスの特徴，AI の利活用目的（仮説検証，知識発見，原因究明，計画策定，判断支 援，活動代替など），活用例（教師あり学習による予測（売上予測，り患予測，成約予測，離反予測），教師なし学習によるグルーピング（顧客セグメンテーション，店舗クラスタ  リング），生成 AI の活用（文章の添削・要約，アイディアの提案，科学論文の執筆，プロ グラミング，画像生成など））を理解する。 AI を利活用する上での脅威，負の事例を理解する。また，AI の出力データにおけるハルシネーション，悪意ある情報（差別的表現など），古い情報などの出力リスク，AI の出力データを人間が確認することの重要性，及び必要に応じて人間が加工して用いることといった AI の出力に対する人間の関与の必要性を理解する。","生産工程の自動制御の仕組みと機能，生産自動化によるコスト削減や危険作業の機械化などの利点，生産自動化の要素技術，動向などを理解する。","生産システムのモデルと生産管理のフェーズ，及び生産管理システムの目的を理解する。また，FA（Factory Automation：ファクトリーオートメーション）システムは生産工程の自動化を図るシステムであり，設計段階から組立，検査，出荷，在庫管理などの工程において合理化を図るために，生産管理システム，生産計画を支援するツールなどを取り入れ，装置制御から工場管理まで効率的な自動化を実現することを理解する。","コンピュータを使用した解析，設計，開発などを行うコンピュータ支援システム，生産性を向上させるためにプロジェクトの計画や管理を支援するシステム，生産や物流，販売の商品供給・流通を統合的に管理するシステムを理解する。","電子決済システムの仕組み，特徴，留意事項を理解する。また，デジタル通貨の種類，暗号化，金融取引との関連を理解する。 e-ビジネス推進上の考え方，留意事項を理解する。 電子商取引におけるリスク，セキュリティ対策の必要性及び留意事項を理解する。","EDI のシステム構成，受発注や決済の仕組み，特徴，EDI の導入による利点と留意事項などを理解する。 取引情報の電子データ交換を実現する上で，多様な取引形態，複数の伝票フォーマットへの対応を効率良く行うためのデータ交換に関する代表的な標準を理解する。","ソーシャルメディアの概念，類型，技術的背景を理解する。","コンピュータが民生機器や産業機器に組み込まれていること，これらの機器を制御する仕組み，組込みシステムの特徴，動向，代表例を理解する。","幅広い製品にコンピュータが組み込まれ，組込みシステムによる細かな制御や機能の提供が実現されていること，小型化，軽量化，ネットワーク化，情報機器の個人所有（パーソナル化），インタラクティブ性の高まりなど近年の動向を理解する。 炊飯器，洗濯機，エアコンなどの家電機器，デジタル TV，DVD などの AV 機器，携帯電話，スマートフォンなどの個人用情報機器，教育・娯楽機器，POS 端末，ハンディターミナル，金融端末などの業務用端末機器などがあることを理解する。","幅広い製品にコンピュータが組み込まれ，組込みシステムによる細かな分析，計測，制御が実現されていること，省力化，無人化，ネットワーク化，インタラクティブ性の高まりなど近年の動向を理解する。 ルータ，MDF（Main Distributing Frame：主配電盤）などの通信設備機器，船舶，航空機などの運輸機器，薬物検知，水質調査などを行う分析機器，計測機器，空調などの設備機器，建設機器などがあることを理解する。 自動車制御システムの特徴，近年の動向を理解する。","企業は，経済的機能，営利活動，所有と経営の分離，市場での独立性などの多面的性質をもつ有機的な組織体であることを理解する。また，ヒト，モノ，カネ，情報に対する管理を理解する。 所有と経営の分離，ゴーイングコンサーン（継続的事業体），企業目的の多様化など，企業の特徴を理解する。","企業の目的を達成するために企業活動を円滑に行い，経営資源の最適配分，有効活用の仕組み作りと運用を行う経営管理の必要性，目的を理解する。また，経営管理には人的資源管理，品質管理，生産管理などが含まれること，マネジメントサイクルの考え方などを理解する。 組織と意思決定に関する科学的アプローチの考え方，バーナード，サイモンらによる近代的経営管理論とシステム工学の関係，システム工学の特徴を理解する。 経営管理におけるヒューマンリソースマネジメント（人的資源管理）の重要性，OJT，目標管理，人材開発，裁量労働制など人的資源管理の手法と考え方を理解する。 リーダーシップ，コミュニケーション，ネゴシエーションなど企業組織における人間行動のあり方，テクニカルライティング，プレゼンテーションなどの伝えるためのモチベーション管理，コンフリクト管理の重要性，管理手法を理解する。 企業価値を維持，向上させる上で障害となるリスクの分析，及び災害などが発生した場合にも必要な事業を継続するための計画策定の重要性を理解する。","経営者の職能， CEO （ Chief Executive Officer ： 最高経営責任者 ）， CIO （ Chief Information Officer：最高情報責任者）などの役職，代表的な組織構造の種類と特徴を理解する。","国際化，業際化，ワークライフバランスを考慮した勤務形態など現代企業の特徴と経営環境の変化，及び企業が取り組むべき課題を理解する。","コンピュータの処理能力の向上，データの多様性，データ量の増加，データ分析の高度化，AI の進化といった IT の進化が促す社会の変化を理解する。 企業活動及び社会生活におけるIT 利活用の動向を理解する。また，社会の変化によって生じている様々な社会課題（労働市場の需給や流動性の変化，人口動態，地球環境，エネルギー問題，教育格差など）を解決するためにIT の利活用が有用であることを理解する。","LP（Linear Programming：線形計画法）の手法，問題の定式化，グラフによる解法，線形計画法が有効と考えられる事例などを理解する。 在庫管理の考え方，定量発注方式，定期発注方式の仕組みを理解する。 PERT や CPM（Critical Path Method：クリティカルパス法）の手法を理解する。 ゲーム理論の考え方を，企業活動における利害得失の具体例を参考に理解する。また，リスクに関する判断基準，意思決定に関する原理を理解する。 作業時間分析法，PTS（Predetermined Time Standard）法，ワークサンプリング法など，代表的な作業測定方法の特徴を理解する。 検査の設計の考え方を踏まえ，抜取り検査，OC（Operating Characteristic：検査特性）曲線，サンプリング，シミュレーションなど代表的な検査手法の特徴を理解する。また， シミュレーションの考え方，シミュレーションモデルが適切かどうかを評価，分析するこ との重要性を理解する。 主に定量分析に用いられる QC 七つ道具及び主に定性分析に用いられる新 QC 七つ道具の手法の活用法を理解する。 業務の分析，計画，効率的な意思決定のための手法（決定理論）を理解する。","目的に応じたデータの収集，収集するデータの種類及び特徴を理解すること，データの発生タイミングや発生頻度を把握することを理解する。 データ分析のために必要となる前処理の手法，扱うデータのドメイン知識の重要性を理解すること，特徴量エンジニアリングの手法，加工データに不具合がないか適切な検証項目を設計して実行すること，収集したデータをデータサイエンスの手法によって分析して今後の事業展開の戦略に活用することを理解する。 統計的手法を用いてデータを分析し，データから言えること，データが何を意味するのかを適切に把握することを理解する。 統計情報やデータ分析結果を，目的に応じて適切な図表やグラフなどで表現して可視化する必要があること，図表やグラフなどの不適切な表現（起点が 0 ではないグラフ，不必要なグラフの立体表現など）に惑わされずに，データを正しく判断することを理解する。","売上高と利益，費用の関係，固定費，変動費，原価を理解する。また，損益分岐点，安全余裕率など関連する指標，変動費及び固定費の変化との関連を理解する。 企業活動に対応させて，取引情報（伝票），日常業務としての取引とその記録（仕訳），会計期間ごとに決算及び実績評価を行うことを理解する。 決算の目的，仕組み，決算で作成される諸表の種類と特徴を理解する。また，子会社を含む企業グループを一つの組織とみなして決算する連結会計の目的，作成される諸表を理解する。 貸借対照表，損益計算書，キャッシュフロー計算書，株主資本等変動計算書の目的，各 諸表の貸方・借方の構成など，財務諸表の見方を理解する。また，売上総利益，営業利益，経常利益などの計算方式を理解する。","企業会計には，法的に定められた情報公開の仕組みである財務会計，企業活動の見直しや経営計画の策定に直結する情報を管理する仕組みである管理会計があることを理解する。","経営分析や経営診断の目的を理解する。また，実数法，比率法などの財務分析手法の考え方，種類と特徴，代表的な財務指標を理解する。","キャッシュフロー会計の目的，キャッシュフロー計算書の対象と構成，キャッシュフロー会計の有効性を理解する。","経営活動に必要な資金を調達し，効率的な投資，キャッシュフローの維持ができるよう計画，調整する資金計画と資金管理の必要性や目的，資金の調達方法を理解する。","資産管理の目的，在庫の評価方法，減価償却，償却費を理解する。また，リースとレンタルの特徴，仕組みを理解する。","投資が適切かどうかを判断するための DCF（Discounted Cash Flow：割引現金収入価値）法，IRR（Internal Rate of Return：内部利益率）法などの経済性計算の手法を理解する。","ソフトウェアなどの知的財産の重要性が増し，開発，流通が盛んになっていく中で，開発者の利益を守り，市場で適正利潤を得られるようにするための法律の整備が進められていることを理解する。また，知的財産の保護は国際的にも重要であり，国際的な条約が締結されていることを理解する。","著作権は複数の権利の集合体であることを理解する。また，日本では，無方式主義を採用しており，著作物を作成した時点で権利が発生しその後一定期間保護されること，著作権法で保護対象となる著作物とは何か，プログラムやデータベースも保護の対象となること，AIの学習データ・生成データそれぞれについて著作権の観点で留意する必要があること，何が権利侵害に当たるのか，所定の条件を満たせば著作権者の許諾を得ることなく著作物を利用することができること，権利侵害時の救済措置を理解する。","産業の発展に寄与することを目的として制定されていること，特許法，実用新案法，意匠法，商標法の保護対象，何が権利侵害に当たるのか，権利侵害時の救済措置を理解する。","商号や商標などの無断使用，営業秘密の不正取得，不正使用などの行為，利益の保護や侵害への措置について不正競争防止法を理解する。また，ソフトウェアの権利の保護には，適宜，著作権法，特許法などを利用することを理解する。","サイバーセキュリティ基本法の目的や施策の基本となる考え方を理解する。","刑法はデータの改ざん，消去などの行為を処罰の対象にしているのに対し，不正アクセス禁止法はネットワークヘの侵入，アクセス制御のための符号提供などを一律に犯罪の対象としていることを理解する。","コンピュータの利用に関して刑事罰に該当する不法行為の種類を理解する。","保護の対象となる個人情報，適用される事業者，法律違反があった場合に企業に及ぶ影響などを理解する。 個人情報の取得，加工，活用，保管，廃棄に関わる情報管理の手法・技法を理解する。","","働き方改革を推進するためにも，労働条件の最低基準を定めた労働基準法に関して，就業規則，賃金，労働時間，労働災害，解雇・退職・定年制などを理解する。 労働者を派遣する場合，労働者，派遣先，派遣元の三者がどのような契約に基づいて，どのような関係にあるかを理解する。また，派遣契約と請負契約の特徴を理解する。 その他の労働関連法規を理解する。","中小受託取引適正化法の目的，規制の対象，仕組みを理解する。 契約の基礎，売買契約の成立，効力，履行・不履行など，民法で規定される取引法と取引上重要な制度の仕組みを理解する。 商法で規定される企業間の取引上，重要な制度の仕組みを理解する。 インターネットを利用した取引などで考慮すべき法律を理解する。","自社以外の事業者に業務を委託する場合に締結する契約であり，締結に当たっては関連する法律などに配慮しなければならないことを理解する。また，外部委託契約の契約形態について，請負契約と（準）委任契約の違いを理解する。 自社以外の事業者に業務を委託する際に，自社の秘密情報を開示する場合，その秘密情 報を守るために NDA（Non-Disclosure Agreement：守秘契約）を締結することを理解する。 ソフトウェアの知的財産権の所有者が，第三者に当該ソフトウェアの利用許諾を与える場合に条件を取り決める契約であることを理解する。また，許諾する条件により様々な契約形態があることを理解する。 委託に基づいて，ソフトウェアの開発を受託するソフトウェア契約であることを理解する。","デジタル社会の形成に関する施策を迅速かつ重点的に推進し，我が国経済の持続的かつ健全な発展と国民の幸福な生活の実現に寄与することを目的として制定されていることを理解する。","官民データ活用の推進に関する施策を総合的かつ効果的に推進し，国民が安全で安心して暮らせる社会及び快適な生活環境の実現に寄与することを目的として制定されていることを理解する。","企業のコンプライアンスの義務と責任，コンプライアンスに違反した場合の法的制裁やリスクを理解する。","データ駆動型社会において行動する際に守るべき法令，情報の不適切な利用から利用者を保護する法令，マナーに関する情報倫理，高度な専門技術者に期待される技術者倫理の重要性，実際に倫理的な行動をとることの必要性を理解する。","遠隔地とのデータ交換，情報ネットワークの構築を行う通信事業者に課されている代表的な法規を理解する。 金融商品取引法が企業内容などの開示の制度，取引の公正性を確保する制度を通じて，国民経済の健全な発展及び投資者の保護に資することを目的とする法律であることを理解する。 会社法は，機関設計，合併などの組織再編行為など，会社に関わる各種の制度のあり方を体系的に規定した法律であることを理解する。 税法を遵守した公正な会計処理を行うことを理解する。 各種法令によって保存が義務付けられている文書について，電子化された文書ファイルでの保存が可能であることを理解する。 国税関係帳簿書類について，磁気媒体での保存に関して規定されていることを理解する。 自動運転装置，無人航空機，産業用ロボットなどの産業機器を安全に活用するための規制や各種の制度があることを理解する。 欠陥があるプログラムを組み込んだハードウェアの使用などによる損害に対して適用される PL（Product Liability：製造物責任）法の目的，規制の対象，仕組みを理解する。 国の行政機関，独立行政法人などに対して，誰でも行政文書や法人文書の情報公開の開示請求ができることを理解する。 環境に配慮する様々な法律の中で，システムやIT 機器の取得，廃棄に関連する規制，カーボンニュートラルの実現を目的とする法律があることを理解する。","JIS（Japanese Industrial Standards）は，JISC（Japanese Industrial StandardsCommittee）の答申を受けて，主務大臣が制定する標準であることを理解する。 IS（International Standards：国際規格）は ISO（International  Organization for Standardization：国際標準化機構）で制定された世界の標準であること，国際標準化機構は各国の代表的標準化機関からなり，電気及び電子技術分野を除く工業製品の国際標準の策定を目的としていることを理解する。 その他，関連する標準・規格，標準化団体，関連機構の役割を理解する。","デファクトスタンダードは事実上の標準として広く用いられている規格，基準，製品などであることを理解する。","","","電子データ交換を行う際の文字コードやバーコードの代表的な標準を理解する。","国際認証の枠組みを理解する。"],"terms_data":[["固定小数点数",0,0,"","","",[],"固定小数点数"],["単精度浮動小数点数",0,0,"","","",[],"単精度浮動小数点数"],["倍精度浮動小数点数",0,0,"","","",[],"倍精度浮動小数点数"],["仮数",0,0,"","","",[],"仮数"],["指数",0,0,"","","",[],"指数"],["BCD",0,0,"BCD","2 進化 10 進","",[],"BCD（Binary Coded Decimal：2 進化 10 進）"],["パック 10 進数",0,0,"","","",[],"パック 10 進数"],["論理シフト",0,1,"","","",[],"論理シフト"],["算術シフト",0,1,"","","",[],"算術シフト"],["桁落ち",0,1,"","","",[],"桁落ち"],["情報落ち",0,1,"","","",[],"情報落ち"],["丸め",0,1,"","","",[],"丸め"],["打切り",0,1,"","","",[],"打切り"],["オーバーフロー",0,1,"","","あふれ",[],"オーバーフロー（あふれ）"],["アンダーフロー",0,1,"","","",[],"アンダーフロー"],["単精度",0,1,"","","",[],"単精度"],["倍精度",0,1,"","","",[],"倍精度"],["和集合",0,2,"","","",[],"和集合"],["積集合",0,2,"","","",[],"積集合"],["補集合",0,2,"","","",[],"補集合"],["部分集合",0,2,"","","",[],"部分集合"],["真",0,2,"","","",[],"真"],["偽",0,2,"","","",[],"偽"],["命題論理",0,2,"","","",[],"命題論理"],["否定",0,3,"","","",[],"否定"],["論理和",0,3,""     TOPICS = D.topics, TTEXT = D.topic_texts, QS = D.questions;
var PER_SESSION = 10;
// terms_data の列
var NAME=0, SUB=1, TOPIC=2, ABBREV=3, FULL=4, GLOSS=5, MEMBERS=6, RAW=7;
// FULL は略語の「意味」。英語のまま解けてしまうものは生成側で除いてある。
// 間隔反復: 正解するたびに次に出るまでのセッション数を伸ばす
var SPACING = [1, 2, 4, 8, 16];
var MEANING = {abbr2full:1, term2gloss:1, gloss2term:1, members:1, term2member:1};

// ---- 保存領域: localStorage が使えなければメモリで続行 (file:// 等) ----
var mem = {}, useLS = false;
try { var k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); useLS = true; }
catch (e) { useLS = false; }
var KEY = "ap-term-drill-v2";
function load(){
  try { var raw = useLS ? localStorage.getItem(KEY) : mem[KEY];
        return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function save(o){
  try { var s = JSON.stringify(o); if (useLS) localStorage.setItem(KEY, s); else mem[KEY] = s; }
  catch(e){ mem[KEY] = JSON.stringify(o); }
}
var st = load() || {};
if (typeof st.n !== "number") st.n = 0;      // セッション通し番号
if (!st.p || typeof st.p !== "object") st.p = {};  // qi -> [box, due]
if (!st.cats) st.cats = null;
if (typeof st.recall !== "boolean") st.recall = true;
if (typeof st.withCat !== "boolean") st.withCat = false;

var $ = function(s){ return document.querySelector(s); };
function subName(i){ return SUBS[i][0]; }
function catOf(i){ return CATS[SUBS[i][1]]; }
function pathOf(ti){
  return catOf(T[ti][SUB]) + " › " + subName(T[ti][SUB]) + " › " + TOPICS[T[ti][TOPIC]];
}
function qCat(q){ return SUBS[q.k === "cat" ? q.c : T[q.a][SUB]][1]; }
function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}

// ---- 問題の見せ方 ----
// stem は問いの型、focus は答えを含まない手掛かり、opt は選択肢の文字列。
var FORM = {
  abbr2full: {label:"略語 → 正式名称", stem:"これが表すものは？",
              focus:function(i){ return T[i][ABBREV]; }, opt:function(i){ return T[i][FULL]; }},
  term2gloss:{label:"用語 → 言い換え", stem:"別の呼び方は？",
              focus:function(i){ return T[i][NAME]; },   opt:function(i){ return T[i][GLOSS]; }},
  gloss2term:{label:"言い換え → 用語", stem:"こう呼ばれる用語は？",
              focus:function(i){ return T[i][GLOSS]; },  opt:function(i){ return T[i][NAME]; }},
  members:   {label:"下位概念 → 用語", stem:"これらをまとめた用語は？",
              focus:function(i){ return T[i][MEMBERS].join("・"); }, opt:function(i){ return T[i][NAME]; }},
  term2member:{label:"用語 → 下位概念", stem:"これに含まれるものは？",
              focus:function(i){ return T[i][NAME]; },
              // 毎回どの下位概念が出るかは変える。同じ組合せの丸暗記を避ける。
              opt:function(i){ var m = T[i][MEMBERS]; return m[Math.floor(Math.random()*m.length)]; }},
  cat:       {label:"分類", stem:"この用語はどの分類？",
              focus:function(i){ return T[i][NAME]; },   opt:null}
};

// ---- 開始画面 ----
$("#nterms").textContent = D.meta.terms.toLocaleString("ja-JP");
$("#disclaimer").textContent = D.meta.note;
$("#nmean").textContent = D.meta.meaning_questions.toLocaleString("ja-JP");

var selected = {};
CATS.forEach(function(_, i){ selected[i] = st.cats ? st.cats.indexOf(i) >= 0 : true; });
var catsEl = $("#cats");
CATS.forEach(function(name, i){
  var b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = name;
  b.setAttribute("aria-pressed", String(!!selected[i]));
  b.addEventListener("click", function(){
    selected[i] = !selected[i];
    b.setAttribute("aria-pressed", String(!!selected[i]));
    syncStart();
  });
  catsEl.appendChild(b);
});
function setAll(v){
  CATS.forEach(function(_, i){ selected[i] = v; });
  Array.prototype.forEach.call(catsEl.children, function(b){ b.setAttribute("aria-pressed", String(v)); });
  syncStart();
}
$("#all").addEventListener("click", function(){ setAll(true); });
$("#none").addEventListener("click", function(){ setAll(false); });

function bindToggle(sel, key){
  var el = $(sel);
  el.setAttribute("aria-pressed", String(!!st[key]));
  el.addEventListener("click", function(){
    st[key] = !st[key];
    el.setAttribute("aria-pressed", String(!!st[key]));
    save(st); syncStart();
  });
}
bindToggle("#tRecall", "recall");
bindToggle("#tCat", "withCat");

function chosenCats(){
  return Object.keys(selected).filter(function(k){ return selected[k]; }).map(Number);
}
function inScope(q, cs){
  if (!cs[qCat(q)]) return false;
  return st.withCat || MEANING[q.k];
}
function catSet(){
  var cs = {}; chosenCats().forEach(function(c){ cs[c] = 1; }); return cs;
}
function duePool(){
  var cs = catSet(), out = [];
  for (var key in st.p){
    var qi = +key, rec = st.p[key];
    if (!QS[qi] || rec[1] > st.n) continue;
    if (!inScope(QS[qi], cs)) continue;
    out.push(qi);
  }
  out.sort(function(a,b){ return st.p[a][1] - st.p[b][1] || st.p[a][0] - st.p[b][0]; });
  return out;
}
function syncStart(){
  var n = chosenCats().length;
  $("#go").disabled = n === 0;
  $("#go").textContent = n === 0 ? "範囲を1つ以上選ぶ" : "はじめる（10問）";
  var d = duePool().length;
  $("#rcount").textContent = d ? "（" + d + "）" : "（なし）";
  $("#goreview").disabled = d === 0;
}

// ---- セッション組み立て: 復習期限が来たものを先に、残りを新規で埋める ----
var session = [], pos = 0, misses = [], answered = false, revealed = false,
    current = null, order = [];

function buildSession(reviewOnly){
  var cs = catSet();
  var out = duePool().slice(0, PER_SESSION);
  if (!reviewOnly && out.length < PER_SESSION){
    var fresh = [];
    for (var i=0;i<QS.length;i++){
      if (st.p[i] !== undefined) continue;
      if (!inScope(QS[i], cs)) continue;
      fresh.push(i);
    }
    shuffle(fresh);
    out = out.concat(fresh.slice(0, PER_SESSION - out.length));
    if (out.length < PER_SESSION){
      // 出し切ったら、期限前のものを期限が近い順に前借りする
      var early = [];
      for (var key in st.p){
        var qi = +key;
        if (out.indexOf(qi) >= 0 || !QS[qi] || !inScope(QS[qi], cs)) continue;
        early.push(qi);
      }
      early.sort(function(a,b){ return st.p[a][1] - st.p[b][1]; });
      out = out.concat(early.slice(0, PER_SESSION - out.length));
    }
  }
  return shuffle(out);
}

function show(id){
  ["start","quiz","end"].forEach(function(s){ $("#"+s).classList.toggle("on", s === id); });
}
function startSession(reviewOnly){
  session = buildSession(reviewOnly);
  if (!session.length) return;
  st.cats = chosenCats(); save(st);
  pos = 0; misses = [];
  show("quiz"); render();
}
// stopPropagation しないと、このクリックが document まで上がって
// 出題直後の想起フェーズをその場で開いてしまう。
$("#go").addEventListener("click", function(e){ e.stopPropagation(); startSession(false); });
$("#goreview").addEventListener("click", function(e){ e.stopPropagation(); startSession(true); });
$("#again").addEventListener("click", function(e){ e.stopPropagation(); startSession(false); });
$("#back").addEventListener("click", function(e){ e.stopPropagation(); syncStart(); show("start"); });

// ---- 出題 ----
function render(){
  answered = false; current = QS[session[pos]];
  var q = current, form = FORM[q.k];
  $("#quiz").classList.remove("answered");
  $("#bar>i").style.width = (pos / PER_SESSION * 100) + "%";
  $("#detail").className = ""; $("#detail").innerHTML = "";

  $("#kind").textContent = form.label;
  $("#stem").textContent = form.stem;
  $("#focus").textContent = form.focus(q.a);

  if (q.k === "cat"){
    order = shuffle([{v:q.c, ok:true}].concat(q.o.map(function(i){ return {v:i, ok:false}; })));
    fill(order.map(function(o){ return subName(o.v); }));
  } else {
    order = shuffle([{v:q.a, ok:true}].concat(q.o.map(function(i){ return {v:i, ok:false}; })));
    fill(order.map(function(o){ return form.opt(o.v); }));
  }

  // 想起フェーズ: 選択肢を伏せる。先に自分で答えを作らせるため。
  revealed = !st.recall;
  $("#quiz").classList.toggle("masked", !revealed);
  $("#cover").classList.toggle("on", !revealed);
  $("#hint").textContent = revealed ? "" : "";
}
function fill(labels){
  var el = $("#opts"); el.innerHTML = "";
  labels.forEach(function(text, i){
    var b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    var n = document.createElement("span"); n.className = "n"; n.textContent = String(i+1);
    var t = document.createElement("span"); t.className = "t"; t.textContent = text;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener("click", function(ev){ ev.stopPropagation(); answer(i); });
    el.appendChild(b);
  });
}
function reveal(){
  if (revealed) return;
  revealed = true;
  $("#quiz").classList.remove("masked");
  $("#cover").classList.remove("on");
}
$("#cover").addEventListener("click", function(ev){ ev.stopPropagation(); reveal(); });

function answer(i){
  if (answered || !revealed) return;
  answered = true;
  $("#quiz").classList.add("answered");
  var picked = order[i], correct = null;
  var btns = $("#opts").children;
  for (var j=0;j<order.length;j++){
    if (order[j].ok){ correct = order[j]; btns[j].dataset.s = "ok"; }
    else if (j === i) btns[j].dataset.s = "ng";
    else btns[j].dataset.s = "dim";
  }
  // 間隔反復: 正解で間隔を伸ばし、誤答で最初に戻す
  var qi = session[pos], rec = st.p[qi] || [0, st.n];
  if (picked.ok){
    rec = [Math.min(rec[0] + 1, SPACING.length - 1), 0];
    rec[1] = st.n + SPACING[rec[0]];
  } else {
    rec = [0, st.n + 1];
    misses.push({q:current, picked:picked.v});
  }
  st.p[qi] = rec; save(st);
  detail(picked, correct);
  $("#hint").textContent = "タップで次へ";
}

function card(cls, head, title, path, body){
  var d = document.createElement("div"); d.className = "card " + cls;
  var h = document.createElement("div"); h.className = "h"; h.textContent = head; d.appendChild(h);
  var t = document.createElement("div"); t.className = "term"; t.textContent = title; d.appendChild(t);
  if (path){ var p = document.createElement("div"); p.className = "path"; p.textContent = path; d.appendChild(p); }
  if (body){ var b = document.createElement("div"); b.className = "body"; b.textContent = body; d.appendChild(b); }
  return d;
}
// 用語そのものを示す一行 (原文の括弧つき表記をそのまま見せる)
function termLine(ti){ return T[ti][RAW] || T[ti][NAME]; }

function detail(picked, correct){
  var el = $("#detail"); el.className = "on"; el.innerHTML = "";
  var q = current;
  if (q.k === "cat"){
    el.appendChild(card("ok", "正解", subName(correct.v),
      catOf(correct.v) + " › " + subName(correct.v) + " › " + TOPICS[T[q.a][TOPIC]],
      TTEXT[T[q.a][TOPIC]] || ""));
    if (!picked.ok){
      el.appendChild(card("ng", "選んだ分類", subName(picked.v),
        catOf(picked.v) + " › " + subName(picked.v), ""));
    }
    return;
  }
  el.appendChild(card("ok", "正解", termLine(correct.v), pathOf(correct.v),
                      TTEXT[T[correct.v][TOPIC]] || ""));
  if (!picked.ok){
    el.appendChild(card("ng", "選んだもの", termLine(picked.v), pathOf(picked.v),
                        TTEXT[T[picked.v][TOPIC]] || ""));
  }
}

// ---- 次へ: 画面のどこをタップしても進む (スクロールとは区別する) ----
var downY = null, moved = false;
document.addEventListener("touchstart", function(e){ downY = e.touches[0].clientY; moved = false; }, {passive:true});
document.addEventListener("touchmove", function(e){
  if (downY !== null && Math.abs(e.touches[0].clientY - downY) > 12) moved = true;
}, {passive:true});
document.addEventListener("click", function(){
  if (moved){ moved = false; return; }
  if (!$("#quiz").classList.contains("on")) return;
  if (!revealed){ reveal(); return; }
  if (answered) next();
});
function next(){
  pos++;
  if (pos >= session.length){ finish(); return; }
  render();
}
function finish(){
  st.n++; save(st);
  $("#bar>i").style.width = "100%";
  var el = $("#misslist"); el.innerHTML = "";
  if (!misses.length){
    var ok = document.createElement("div"); ok.className = "allok";
    ok.textContent = "取りこぼしなし。";
    el.appendChild(ok);
  } else {
    var lead = document.createElement("p"); lead.className = "sub";
    lead.textContent = "次はここを見ておく（" + misses.length + " 件）";
    el.appendChild(lead);
    misses.forEach(function(m){
      var q = m.q, d = document.createElement("div"); d.className = "miss";
      var t = document.createElement("div"); t.className = "term";
      var p = document.createElement("div"); p.className = "path";
      t.textContent = termLine(q.a);
      p.textContent = q.k === "cat"
        ? catOf(q.c) + " › " + subName(q.c)
        : FORM[q.k].label + " ／ " + pathOf(q.a);
      d.appendChild(t); d.appendChild(p); el.appendChild(d);
    });
  }
  show("end");
}

// ---- キーボード: 1〜4 で選択, スペースで開く/次へ ----
document.addEventListener("keydown", function(e){
  if (!$("#quiz").classList.contains("on")) return;
  if (e.key >= "1" && e.key <= "4"){
    var i = parseInt(e.key, 10) - 1;
    if (revealed && !answered && i < order.length){ e.preventDefault(); answer(i); }
  } else if (e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if (!revealed) reveal();
    else if (answered) next();
  }
});

syncStart();
})();
</script>
